const db = {
  loadAll: async function() {
    // Retry transient failures. A single failed fetch otherwise leaves the logo
    // map empty for the entire session, so every course falls back to its crest
    // symbol (the "missing logo" bug). Flaky mobile networks trigger this.
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        const r = await fetch(SB_URL + "/rest/v1/logos?select=course_id,data", { headers: SB_HEADERS });
        if (r.ok) {
          const rows = await r.json();
          const result = {};
          rows.forEach(function(row) { result[row.course_id] = row.data; });
          return result;
        }
      } catch(e) { /* fall through to retry */ }
      await new Promise(function(res){ setTimeout(res, 400 * (attempt + 1)); });
    }
    console.error("Supabase loadAll failed after 3 attempts — logos unavailable this session.");
    return {};
  },
  save: async function(id, dataUrl) {
    try {
      const r = await fetch(SB_URL + "/rest/v1/logos", {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({ course_id: id, data: dataUrl })
      });
      if (!r.ok) {
        const txt = await r.text();
        console.error("Supabase save failed:", r.status, txt);
        alert("⚠️ Logo did NOT save to the cloud (error " + r.status + "). It's only showing on this device right now — please re-try the upload.");
      }
    } catch(e) { console.error("Supabase network error:", e.message); }
  },
  remove: async function(id) {
    try {
      await fetch(SB_URL + "/rest/v1/logos?course_id=eq." + id, {
        method: "DELETE",
        headers: SB_HEADERS
      });
    } catch(e) {}
  }
};

/* ═══════════════════════════════════════════════════════
   AUDIO ENGINE — authentic golf sounds via Web Audio API
═══════════════════════════════════════════════════════ */
let _audioCtx = null;
function ctx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === "suspended") _audioCtx.resume();
  return _audioCtx;
}

// Crisp iron strike: sharp transient impact + metallic ring + brief ball-flight hiss
function playClick() {
  try {
    const c = ctx(), t = c.currentTime, sr = c.sampleRate;

    // ── Impact transient (8ms of shaped noise — the "tock" of clubface)
    const impLen = Math.floor(sr * 0.009);
    const impBuf = c.createBuffer(1, impLen, sr);
    const impD = impBuf.getChannelData(0);
    for (let i = 0; i < impLen; i++) {
      const env = Math.pow(1 - i / impLen, 1.6);
      impD[i] = (Math.random() * 2 - 1) * env;
    }
    const imp = c.createBufferSource(); imp.buffer = impBuf;
    const impFilt = c.createBiquadFilter(); impFilt.type = "bandpass";
    impFilt.frequency.value = 4200; impFilt.Q.value = 0.7;
    const impG = c.createGain(); impG.gain.setValueAtTime(0.75, t);
    imp.connect(impFilt); impFilt.connect(impG); impG.connect(c.destination);
    imp.start(t);

    // ── Metallic ring — iron face resonance (high chirp sweeping down)
    const ring = c.createOscillator(); ring.type = "sine";
    const ringG = c.createGain();
    ring.frequency.setValueAtTime(3200, t);
    ring.frequency.exponentialRampToValueAtTime(1600, t + 0.06);
    ring.frequency.exponentialRampToValueAtTime(800,  t + 0.16);
    ringG.gain.setValueAtTime(0.14, t);
    ringG.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    ring.connect(ringG); ringG.connect(c.destination);
    ring.start(t); ring.stop(t + 0.2);

    // ── Low body thud (the feel of the strike)
    const body = c.createOscillator(); body.type = "triangle";
    const bodyG = c.createGain();
    body.frequency.setValueAtTime(380, t);
    body.frequency.exponentialRampToValueAtTime(180, t + 0.09);
    bodyG.gain.setValueAtTime(0.10, t);
    bodyG.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    body.connect(bodyG); bodyG.connect(c.destination);
    body.start(t); body.stop(t + 0.13);

    // ── Ball-flight hiss (very faint, fades in after impact)
    const hissLen = Math.floor(sr * 0.18);
    const hissBuf = c.createBuffer(1, hissLen, sr);
    const hissD = hissBuf.getChannelData(0);
    for (let i = 0; i < hissLen; i++) {
      const env = (i / hissLen) * Math.pow(1 - i / hissLen, 2.0);
      hissD[i] = (Math.random() * 2 - 1) * env;
    }
    const hiss = c.createBufferSource(); hiss.buffer = hissBuf;
    const hissFilt = c.createBiquadFilter(); hissFilt.type = "highpass"; hissFilt.frequency.value = 5000;
    const hissG = c.createGain(); hissG.gain.setValueAtTime(0.07, t + 0.01);
    hiss.connect(hissFilt); hissFilt.connect(hissG); hissG.connect(c.destination);
    hiss.start(t + 0.01);
  } catch(_) {}
}

// Ball dropping into cup: hollow "tok" on edge, then the iconic rattle-settle
function playCupIn() {
  try {
    const c = ctx(), t = c.currentTime, sr = c.sampleRate;

    // ── First contact — ball hits cup edge (hollow, wooden-plastic quality)
    const tok1 = c.createOscillator(); tok1.type = "sine";
    const tok1G = c.createGain();
    tok1.frequency.setValueAtTime(560, t);
    tok1.frequency.exponentialRampToValueAtTime(290, t + 0.09);
    tok1G.gain.setValueAtTime(0.28, t);
    tok1G.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    tok1.connect(tok1G); tok1G.connect(c.destination);
    tok1.start(t); tok1.stop(t + 0.16);

    // Second harmonic for richness
    const tok1b = c.createOscillator(); tok1b.type = "sine";
    const tok1bG = c.createGain();
    tok1b.frequency.setValueAtTime(1120, t);
    tok1b.frequency.exponentialRampToValueAtTime(580, t + 0.07);
    tok1bG.gain.setValueAtTime(0.09, t);
    tok1bG.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    tok1b.connect(tok1bG); tok1bG.connect(c.destination);
    tok1b.start(t); tok1b.stop(t + 0.1);

    // ── Bottom of cup impact (slightly lower, 85ms later)
    const tok2 = c.createOscillator(); tok2.type = "sine";
    const tok2G = c.createGain();
    tok2.frequency.setValueAtTime(420, t + 0.085);
    tok2.frequency.exponentialRampToValueAtTime(200, t + 0.085 + 0.1);
    tok2G.gain.setValueAtTime(0.22, t + 0.085);
    tok2G.gain.exponentialRampToValueAtTime(0.001, t + 0.085 + 0.16);
    tok2.connect(tok2G); tok2G.connect(c.destination);
    tok2.start(t + 0.085); tok2.stop(t + 0.28);

    // ── Rattle/settle — the ball rolling around the cup bottom
    const rattleLen = Math.floor(sr * 0.22);
    const rattleBuf = c.createBuffer(1, rattleLen, sr);
    const rattleD = rattleBuf.getChannelData(0);
    for (let i = 0; i < rattleLen; i++) {
      // Bursting, irregular — simulates ball bouncing inside
      const burst = Math.sin(i * 0.004) * Math.sin(i * 0.017) * Math.sin(i * 0.031);
      const env = Math.pow(1 - i / rattleLen, 1.2);
      rattleD[i] = (Math.random() * 2 - 1) * Math.abs(burst) * env * 0.9;
    }
    const rattle = c.createBufferSource(); rattle.buffer = rattleBuf;
    const rattleFilt = c.createBiquadFilter(); rattleFilt.type = "bandpass";
    rattleFilt.frequency.value = 1400; rattleFilt.Q.value = 1.8;
    const rattleG = c.createGain();
    rattleG.gain.setValueAtTime(0.22, t + 0.16);
    rattleG.gain.exponentialRampToValueAtTime(0.001, t + 0.44);
    rattle.connect(rattleFilt); rattleFilt.connect(rattleG); rattleG.connect(c.destination);
    rattle.start(t + 0.16);
  } catch(_) {}
}

// Sand explosion: burst of shaped noise = ball hitting a bunker
function playWrong() {
  try {
    const c = ctx(), t = c.currentTime, sr = c.sampleRate;

    // ── Sandy explosion — shaped noise with fast attack, slow decay
    const dur = 0.38;
    const sandLen = Math.floor(sr * dur);
    const sandBuf = c.createBuffer(1, sandLen, sr);
    const sandD = sandBuf.getChannelData(0);
    for (let i = 0; i < sandLen; i++) {
      const attackEnd = Math.floor(sr * 0.018);
      const env = i < attackEnd
        ? i / attackEnd
        : Math.pow(1 - (i - attackEnd) / (sandLen - attackEnd), 0.75);
      sandD[i] = (Math.random() * 2 - 1) * env;
    }
    const sand = c.createBufferSource(); sand.buffer = sandBuf;
    // Band-limited to sound granular, not just white noise
    const sandFilt = c.createBiquadFilter(); sandFilt.type = "bandpass";
    sandFilt.frequency.value = 900; sandFilt.Q.value = 0.55;
    const sandG = c.createGain(); sandG.gain.setValueAtTime(0.32, t);
    sand.connect(sandFilt); sandFilt.connect(sandG); sandG.connect(c.destination);
    sand.start(t);

    // Low-frequency thud of ball hitting the sand
    const thud = c.createOscillator(); thud.type = "sine";
    const thudG = c.createGain();
    thud.frequency.setValueAtTime(160, t);
    thud.frequency.exponentialRampToValueAtTime(55, t + 0.13);
    thudG.gain.setValueAtTime(0.22, t);
    thudG.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    thud.connect(thudG); thudG.connect(c.destination);
    thud.start(t); thud.stop(t + 0.2);

    // Brief high splatter (the sand grains hitting the surface)
    const splatLen = Math.floor(sr * 0.08);
    const splatBuf = c.createBuffer(1, splatLen, sr);
    const splatD = splatBuf.getChannelData(0);
    for (let i = 0; i < splatLen; i++) splatD[i] = (Math.random() * 2 - 1) * (1 - i/splatLen);
    const splat = c.createBufferSource(); splat.buffer = splatBuf;
    const splatFilt = c.createBiquadFilter(); splatFilt.type = "highpass"; splatFilt.frequency.value = 3500;
    const splatG = c.createGain(); splatG.gain.setValueAtTime(0.10, t + 0.02);
    splat.connect(splatFilt); splatFilt.connect(splatG); splatG.connect(c.destination);
    splat.start(t + 0.02);
  } catch(_) {}
}

  },

/* ═══════════════════════════════════════════════════════
   GAME FACTORY
═══════════════════════════════════════════════════════ */
function makeGame(pool = ALL_COURSES) {
  const shuffled = [...pool].sort(() => Math.random() - .5);
  const picks = shuffled.slice(0, 5);
  return picks.map(correct => {
    const others = ALL_COURSES.filter(c => c.id !== correct.id).sort(() => Math.random() - .5).slice(0, 3);
    const opts = [...others, correct].sort(() => Math.random() - .5);
    return { correct, opts, ansIdx: opts.findIndex(o => o.id === correct.id) };
  });
}

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
const fmt = ms => ms < 1000 ? `${ms}ms` : `${(ms/1000).toFixed(1)}s`;
const fmtFull = ms => (ms/1000).toFixed(2) + "s";

function calcStats(history) {
  if (!history.length) return { games:0, correct:0, total:0, correctRate:0, perfect:0, maxStreak:0, bestTime:null, fastestAnswer:null, perfectFastGame:null, quickReturn:false };
  let correct=0, total=0, perfect=0, streak=0, maxStreak=0, bestTime=null, fastestAnswer=null, perfectFastGame=null, quickReturn=false;
  history.forEach((g, i) => {
    const score = g.results.filter(Boolean).length;
    correct += score; total += 5;
    if (score === 5) { perfect++; streak++; maxStreak = Math.max(maxStreak, streak); if (!bestTime || g.totalMs < bestTime) bestTime = g.totalMs; if (g.totalMs < 20000) perfectFastGame = g.totalMs; }
    else streak = 0;
    g.times.forEach(t => { if (g.results[g.times.indexOf(t)]) { if (!fastestAnswer || t < fastestAnswer) fastestAnswer = t; } });
    if (i > 0) { const prev = history[i-1]; if (g.ts - prev.ts < 30*60*1000) quickReturn = true; }
  });
  return { games:history.length, correct, total, correctRate: total ? Math.round(correct/total*100) : 0, perfect, maxStreak, bestTime, fastestAnswer, perfectFastGame, quickReturn };
}

function checkTrophies(stats, prevTrophySet) {
  const earned = new Set(prevTrophySet);
  const newOnes = [];
  TROPHY_DEFS.forEach(t => {
    if (!earned.has(t.id) && t.check(stats)) { earned.add(t.id); newOnes.push(t); }
  });
  return { earned, newOnes };
}

function generateShare(game, results, times, profile, stats) {
  const score = results.filter(Boolean).length;
  const total = times.reduce((a,b)=>a+b,0);
  const emojis = results.map(r => r ? "✅" : "❌").join("");
  const lines = [
    `⛳ Golf Course IQ`,
    profile.username ? `🏌️ @${profile.username}${profile.tagline ? ` · "${profile.tagline}"` : ""}` : "",
    ``,
    `${emojis}`,
    `📊 ${score}/5 correct · ⏱️ ${fmtFull(total)} total`,
    ``,
    ...game.map((q,i) => {
      const picked = q.opts.find((_, oi) => oi === (results[i] ? q.ansIdx : game[i]._picked));
      return `${results[i]?"✅":"❌"} Q${i+1}: ${q.correct.name} (${fmtFull(times[i])})`;
    }),
    ``,
    `🏅 All-time: ${stats.correctRate}% · ${stats.games} game${stats.games!==1?"s":""}`,
    ``,
    `Play Golf Course IQ → golf-iq.app`,
  ].filter(l => l !== undefined);
  return lines.join("\n");
}

/* ═══════════════════════════════════════════════════════
   CLUB CREST — SVG heraldic badge rendered when no logo loads.
   Looks like an actual embroidered club crest, not letters.
═══════════════════════════════════════════════════════ */
function ClubCrest({ course, size }) {
  const r = size / 2;
  const numDots = 16;
  // Outer decorative ring dots
  const dots = Array.from({ length: numDots }, (_, i) => {
    const angle = (i / numDots) * Math.PI * 2 - Math.PI / 2;
    return {
      x: r + (r - 7) * Math.cos(angle),
      y: r + (r - 7) * Math.sin(angle),
    };
  });
  // Crossed clubs path (simplified SVG paths centered on r,r)
  const sc = size / 100; // scale factor
  const cx = r, cy = r;

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:"block" }}>
      <defs>
        <radialGradient id={`bg-${course.id}`} cx="40%" cy="35%">
          <stop offset="0%" stopColor={course.col} stopOpacity="1" />
          <stop offset="100%" stopColor={`${course.col}88`} stopOpacity="1" />
        </radialGradient>
        <radialGradient id={`sheen-${course.id}`} cx="38%" cy="28%">
          <stop offset="0%" stopColor="rgba(255,255,255,0.18)" />
          <stop offset="60%" stopColor="rgba(255,255,255,0)" />
        </radialGradient>
      </defs>

      {/* Background circle */}
      <circle cx={r} cy={r} r={r - 1} fill={`url(#bg-${course.id})`} />

      {/* Sheen highlight */}
      <circle cx={r} cy={r} r={r - 1} fill={`url(#sheen-${course.id})`} />

      {/* Outer gold ring */}
      <circle cx={r} cy={r} r={r - 2} fill="none" stroke="rgba(200,168,75,0.75)" strokeWidth="2" />

      {/* Inner decorative ring */}
      <circle cx={r} cy={r} r={r * 0.78} fill="none" stroke="rgba(200,168,75,0.3)" strokeWidth="1" strokeDasharray="3 2.5" />

      {/* Decorative dots on outer ring */}
      {dots.map((d, i) => (
        <circle key={i} cx={d.x} cy={d.y} r={i % 4 === 0 ? 2 : 1.2}
          fill={i % 4 === 0 ? "rgba(200,168,75,0.85)" : "rgba(200,168,75,0.4)"} />
      ))}

      {/* Course symbol emoji — prominent, centered */}
      {course.sym
        ? <>
            <text
              x={r} y={cy + r * 0.18}
              textAnchor="middle" dominantBaseline="middle"
              fontSize={size * 0.38}
              style={{ userSelect:"none" }}
            >
              {course.sym}
            </text>
            {/* Club initials below emoji */}
            <text
              x={r} y={cy + r * 0.72}
              textAnchor="middle"
              fontSize={course.init.length > 3 ? size * 0.105 : course.init.length > 2 ? size * 0.12 : size * 0.135}
              fontFamily="'Playfair Display', Georgia, serif"
              fontWeight="700"
              fill="rgba(255,220,120,0.9)"
              letterSpacing="1.5"
            >
              {course.init}
            </text>
          </>
        : <>
            {/* Fallback: golf flag + initials */}
            <line x1={cx - 2} y1={cy - r * 0.36} x2={cx - 2} y2={cy + r * 0.32}
              stroke="rgba(220,195,110,0.9)" strokeWidth={1.6 * sc * 2} strokeLinecap="round" />
            <polygon
              points={`${cx - 1},${cy - r * 0.36} ${cx + r * 0.26},${cy - r * 0.22} ${cx - 1},${cy - r * 0.06}`}
              fill="rgba(200,168,75,0.9)" />
            <ellipse cx={cx - 2} cy={cy + r * 0.34} rx={r * 0.16} ry={r * 0.045}
              fill="rgba(0,0,0,0.25)" />
            <text
              x={r} y={cy + r * 0.61}
              textAnchor="middle"
              fontSize={course.init.length > 3 ? size * 0.115 : course.init.length > 2 ? size * 0.135 : size * 0.155}
              fontFamily="'Playfair Display', Georgia, serif"
              fontWeight="700"
              fill="rgba(255,220,120,0.95)"
              letterSpacing="1.5"
            >
              {course.init}
            </text>
          </>
      }

      {/* Thin gold baseline under initials */}
      <line
        x1={r - r * 0.32} y1={cy + r * 0.78}
        x2={r + r * 0.32} y2={cy + r * 0.78}
        stroke="rgba(200,168,75,0.4)" strokeWidth="0.8"
      />
    </svg>
  );
}

═══════════════════════════════════════════════════════ */
function OptBtn({ letter, option, state, onClick, disabled }) {
  const cls = { idle:"gi-opt-idle", sel:"gi-opt-sel", ok:"gi-opt-ok", bad:"gi-opt-bad", dim:"gi-opt-dim" };
  const icons = { ok:"✓", bad:"✗" };
  const rippleRef = useRef(null);

  const handleClick = (e) => {
    if (disabled || state !== "idle") return;
    // Ripple
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const rip = document.createElement("div");
    rip.className = "gi-ripple";
    rip.style.left = `${e.clientX - rect.left}px`;
    rip.style.top  = `${e.clientY - rect.top}px`;
    btn.appendChild(rip);
    setTimeout(() => rip.remove(), 650);
    onClick();
  };

  return (
    <button className={`gi-opt ${cls[state]||"gi-opt-idle"}`}
      onClick={handleClick} disabled={disabled || state==="dim"} style={{position:"relative",overflow:"hidden"}}>
      <div className="gi-opt-inner">
        <span className="gi-opt-letter">{letter}</span>
        <div className="gi-opt-sep" />
        <span className="gi-opt-text">
          <span style={{fontWeight:600}}>{option.name}</span>
          <br/>
          <span style={{fontSize:12,opacity:.7,fontWeight:400}}>📍 {option.loc}</span>
        </span>
        {(state==="ok"||state==="bad") && <span className="gi-opt-icon">{icons[state]}</span>}
      </div>
    </button>
  );
}

/* ═══════════════════════════════════════════════════════
   GAME SCREEN
═══════════════════════════════════════════════════════ */
function GameScreen({ game, profile, logos, onComplete }) {
  const [qIdx, setQIdx]       = useState(0);
  const [results, setResults] = useState([]);
  const [times, setTimes]     = useState([]);
  const [picked, setPicked]   = useState([]); // index chosen per Q
  const [phase, setPhase]     = useState("idle"); // idle | sel | done
  const [selectedOpt, setSel] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const qStart                = useRef(Date.now());
  const timerRef              = useRef(null);

  const q = game[qIdx];
  const totalElapsed = times.reduce((a,b)=>a+b,0) + elapsed;

  // Per-question timer
  useEffect(() => {
    qStart.current = Date.now();
    setElapsed(0);
    timerRef.current = setInterval(() => setElapsed(Date.now() - qStart.current), 87);
    return () => clearInterval(timerRef.current);
  }, [qIdx]);

  const choose = (optIdx) => {
    if (phase !== "idle") return;
    clearInterval(timerRef.current);
    const t = Date.now() - qStart.current;
    const correct = optIdx === q.ansIdx;
    setSel(optIdx);
    setPhase("sel");
    playClick();

    setTimeout(() => {
      setPhase("done");
      correct ? playCupIn() : playWrong();

      const newResults = [...results, correct];
      const newTimes   = [...times, t];
      const newPicked  = [...picked, optIdx];
      setResults(newResults); setTimes(newTimes); setPicked(newPicked);

      if (qIdx < 4) {
        setTimeout(() => {
          setQIdx(i => i+1);
          setSel(null); setPhase("idle");
        }, 1400);
      } else {
        setTimeout(() => onComplete({ results:newResults, times:newTimes, picked:newPicked }), 1600);
      }
    }, 480);
  };

  const optState = (i) => {
    if (phase === "idle") return "idle";
    if (phase === "sel")  return i === selectedOpt ? "sel" : "idle";
    if (i === q.ansIdx)   return "ok";
    if (i === selectedOpt) return "bad";
    return "idle";
  };

  const isOver6s = elapsed > 6000;

  return (
    <div className="gi-app" style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div className="gi-stars"/>
      <div className="gi-screen" style={{flex:1,display:"flex",flexDirection:"column",maxWidth:520,margin:"0 auto",width:"100%",padding:"18px 16px",gap:14}}>

        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {Array.from({length:5},(_,i)=>(
              <div key={i} className={`gi-dot ${i<qIdx?(results[i]?"gi-dot-correct":"gi-dot-wrong"):i===qIdx?"gi-dot-active":""}`}/>
            ))}
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
            <div className={`gi-timer ${isOver6s?"gi-timer-fast":""}`}>{fmtFull(elapsed)}</div>
            <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".1em"}}>THIS HOLE</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontWeight:700,color:"rgba(200,168,75,.8)",fontSize:18}}>
              {results.filter(Boolean).length}/{qIdx}
            </div>
            <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".08em"}}>SCORE</div>
          </div>
        </div>

        <div className="gi-progress-wrap"><div className="gi-progress-fill" style={{width:`${(qIdx/5)*100}%`}}/></div>

        {/* Logo spotlight */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"12px 0",position:"relative"}}>
          <div className="gi-spotlight" style={{width:240,height:240}}/>
          <div className="gi-logo-ring" style={{width:144,height:144,position:"relative",zIndex:1}}>
            <CourseLogo course={q.correct} size={144} allowSuggest={true} uploadedData={logos && logos[q.correct.id]}/>
          </div>
          <div style={{marginTop:14,textAlign:"center",position:"relative",zIndex:1}}>
            <div style={{fontSize:12,color:"rgba(200,168,75,.5)",letterSpacing:".14em",marginBottom:4}}>
              HOLE {qIdx+1} OF 5
            </div>
            <div style={{fontSize:11,color:"rgba(200,180,140,.4)",letterSpacing:".06em"}}>
              {q.correct.logoUrl ? "Which course does this logo belong to?" : "Which course does this emblem represent?"}
            </div>
            {!q.correct.logoUrl && (
              <div style={{fontSize:9,color:"rgba(200,168,75,.25)",marginTop:4,letterSpacing:".04em"}}>
                Have the real logo? Tap 📷 to upload it
              </div>
            )}
          </div>
        </div>

        {/* Options */}
        <div style={{display:"flex",flexDirection:"column",gap:9,flex:1}}>
          {q.opts.map((opt, i) => (
            <OptBtn key={opt.id} letter={"ABCD"[i]} option={opt}
              state={optState(i)} onClick={()=>choose(i)} disabled={phase!=="idle"}/>
          ))}
        </div>

        {/* Total time */}
        <div style={{textAlign:"center",fontSize:12,color:"rgba(200,168,75,.3)",letterSpacing:".08em"}}>
          ⏱ TOTAL: {fmtFull(totalElapsed)}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ADMIN SCREEN — Logo Manager
═══════════════════════════════════════════════════════ */
function AdminLogoCard({ course, uploadedData, onSave, onRemove }) {
  const [dragging, setDragging] = useState(false);
  const [saving, setSaving]     = useState(false);
  const [flash, setFlash]       = useState(false);
  const [imgErr, setImgErr]     = useState(false);
  const fileRef                 = useRef(null);
  const dragCount               = useRef(0);

  const status = uploadedData ? "up" : course.logoUrl ? "bi" : "mi";
  const displayUrl = uploadedData || (course.logoUrl && !imgErr ? course.logoUrl : null);
  const borderColor = flash ? "#4caf7d" : dragging ? "#c8a84b" : status === "up" ? "rgba(76,175,80,.5)" : "rgba(255,255,255,.1)";

  const readAndSave = function(file) {
    if (!file) return;
    setSaving(true);
    var reader = new FileReader();
    reader.onload = function(e) {
      onSave(course.id, e.target.result);
      setSaving(false);
      setFlash(true);
      setTimeout(function(){ setFlash(false); }, 1500);
    };
    reader.onerror = function() {
      setSaving(false);
      alert("Could not read file.");
    };
    reader.readAsDataURL(file);
  };

  const handleDrop = function(e) {
    e.preventDefault();
    dragCount.current = 0;
    setDragging(false);
    var files = e.dataTransfer.files;
    if (files && files.length > 0) { readAndSave(files[0]); return; }
    var items = e.dataTransfer.items;
    if (items && items.length > 0 && items[0].kind === "file") { readAndSave(items[0].getAsFile()); }
  };

  const doSave = function() {};

  return (
    <div
      onDrop={handleDrop}

   ═══════════════════════════════════════════════════════ */
const DAILY_OVERRIDES = {
  // populated as tournament schedule is confirmed

/* ═══════════════════════════════════════════════════════
   DAILY START DATE — Day 1 of the Daily Course feature.
   Used to compute "Day N" labels in share strings and to
   determine which course is today's puzzle.
   ───────────────────────────────────────────────────────
   IMPORTANT: do not change this once Daily Course is live.
   Changing it shifts every player's day count.
   ═══════════════════════════════════════════════════════ */
const DAILY_EPOCH = "2026-05-19";  // Day 1 = launch day for testing
/* ═══════════════════════════════════════════════════════
   DAILY HELPERS — Date math and course selection
   ═══════════════════════════════════════════════════════ */

// Returns "YYYY-MM-DD" in ET timezone (puzzle reveal is midnight ET)
function getETDateString(d) {
  d = d || new Date();
  // ET is UTC-5 (EST) or UTC-4 (EDT). Use Intl for accuracy across DST.
  const fmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York",
    year: "numeric", month: "2-digit", day: "2-digit"
  });
  return fmt.format(d);  // returns "YYYY-MM-DD"
}

// Days since DAILY_EPOCH, in ET. Day 1 = epoch day itself.
function getDayNumber(dateStr) {
  dateStr = dateStr || getETDateString();
  const epoch = new Date(DAILY_EPOCH + "T12:00:00Z");
  const today = new Date(dateStr + "T12:00:00Z");
  const diff = Math.floor((today - epoch) / (1000 * 60 * 60 * 24));
  return diff + 1;  // Day 1 = epoch
}

// Today's course: override > sequence rotation
function getCourseOfDay(dateStr) {
  dateStr = dateStr || getETDateString();
  if (DAILY_OVERRIDES[dateStr]) {
    const ov = ALL_COURSES.find(c => c.id === DAILY_OVERRIDES[dateStr]);
    if (ov) return ov;
  }
  const dayNum = getDayNumber(dateStr);
  if (dayNum < 1) return null;  // pre-launch
  const idx = (dayNum - 1) % DAILY_SEQUENCE.length;
  const id = DAILY_SEQUENCE[idx];
  return ALL_COURSES.find(c => c.id === id);
}

/* ═══════════════════════════════════════════════════════
   DISTRACTOR SELECTION FOR DAILY
   ───────────────────────────────────────────────────────
   Pulls 3 wrong-answer choices from the full Top 100 pool.
   Honors the initials-matching rule for letter-logo
   courses. Deterministic per day so all players see the
   same 4 options (essential for Wordle-style fairness).
   ═══════════════════════════════════════════════════════ */

// Courses whose logos are letters/initials — distractors must match initial
const INITIALS_LOGO_COURSES = {
  "sebonack":      "S",
  "sand-hills":    "SH",
  "sand-valley-gc":"SV",
  "sheep-ranch":   "SR",
  "quarry-lq":     "Q",
  "peachtree":     "P",  // PCG technically; P is sufficient
};

// Deterministic shuffle seeded by date string
function seededShuffle(arr, seed) {
  // Simple xorshift seeded from string
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const rand = () => {
    h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
    return ((h >>> 0) % 100000) / 100000;
  };
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getDailyOptions(correctCourse, dateStr) {
  dateStr = dateStr || getETDateString();
  const correctInitial = INITIALS_LOGO_COURSES[correctCourse.id];

  let candidatePool;
  if (correctInitial) {
    // Initial-match rule: distractors must start with the same letter(s)
    candidatePool = ALL_COURSES.filter(c =>
      c.id !== correctCourse.id &&
      c.name.toUpperCase().startsWith(correctInitial.toUpperCase())
    );
    // Fallback if pool too thin — use first-letter match
    if (candidatePool.length < 3) {
      const firstChar = correctInitial[0].toUpperCase();
      candidatePool = ALL_COURSES.filter(c =>
        c.id !== correctCourse.id &&
        c.name.toUpperCase().startsWith(firstChar)
      );
    }
    // Final fallback if still thin: pull from anywhere
    if (candidatePool.length < 3) {
      candidatePool = ALL_COURSES.filter(c => c.id !== correctCourse.id);
    }
  } else {
    candidatePool = ALL_COURSES.filter(c => c.id !== correctCourse.id);
  }

  // Deterministic shuffle by date — every player gets same options
  const shuffled = seededShuffle(candidatePool, dateStr + correctCourse.id);
  const distractors = shuffled.slice(0, 3);
  const allOpts = seededShuffle([...distractors, correctCourse], dateStr + "-final");
  return {
    opts: allOpts,
    ansIdx: allOpts.findIndex(o => o.id === correctCourse.id)
  };
}

/* ═══════════════════════════════════════════════════════
   STREAK MATH — Knowledge-based with 7-day pause window
   ───────────────────────────────────────────────────────
   Returns one of:
     { state: "active",  streak: N, lastPlayedDay: "YYYY-MM-DD" }
     { state: "paused",  streak: N, daysSinceLastPlay: D }
     { state: "broken",  streak: 0 }
     { state: "fresh",   streak: 0 }   // never played
   ═══════════════════════════════════════════════════════ */

const STREAK_PAUSE_MAX = 7;  // miss 7+ days and streak resets

// dailyHistory: array of { day: "YYYY-MM-DD", correct: boolean }
function computeStreak(dailyHistory, today) {
  today = today || getETDateString();
  if (!dailyHistory || dailyHistory.length === 0) {
    return { state: "fresh", streak: 0 };
  }

  // Sort chronologically
  const history = [...dailyHistory].sort((a, b) => a.day.localeCompare(b.day));
  const last = history[history.length - 1];

  // If the last play was wrong, streak is broken regardless of timing
  // BUT only if it's the most recent attempt — we walk back from the end
  // and count consecutive correct days.

  let streak = 0;
  let lastCorrectDay = null;
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].correct) {
      // Check chronological continuity
      if (lastCorrectDay === null) {
        lastCorrectDay = history[i].day;
        streak = 1;
      } else {
        const gap = daysBetween(history[i].day, lastCorrectDay);
        if (gap === 1) {
          streak++;
          lastCorrectDay = history[i].day;
        } else {
          break;  // gap in correct answers — streak ends here
        }
      }
    } else {
      // Wrong answer breaks the streak
      if (lastCorrectDay === null) {
        return { state: "broken", streak: 0 };
      }
      break;
    }
  }

  if (streak === 0) return { state: "fresh", streak: 0 };

  const daysSince = daysBetween(lastCorrectDay, today);

  if (daysSince === 0) {
    // Played today, correct — active
    return { state: "active", streak, lastPlayedDay: lastCorrectDay };
  }
  if (daysSince <= STREAK_PAUSE_MAX) {
    return { state: "paused", streak, daysSinceLastPlay: daysSince };
  }
  // Beyond pause window — broken
  return { state: "broken", streak: 0 };
}

function daysBetween(dayA, dayB) {
  const a = new Date(dayA + "T12:00:00Z");
  const b = new Date(dayB + "T12:00:00Z");
  return Math.round((b - a) / (1000 * 60 * 60 * 24));
}

/* ═══════════════════════════════════════════════════════
   DAILY SHARE STRING
   ───────────────────────────────────────────────────────
   Spoiler-free: only reveals time and streak, never the
   course or whether the player got it right (the emoji
   does that, optionally). Format intentionally short for
   group-chat sharing.
   ═══════════════════════════════════════════════════════ */
function generateDailyShare(dayNum, timeMs, correct, streakInfo) {
  const sec = (timeMs / 1000).toFixed(1);
  const emoji = correct ? "⛳" : "💨";
  const result = correct ? `got it in ${sec}s` : `missed in ${sec}s`;
  let streakBit = "";
  if (streakInfo.state === "active" && streakInfo.streak > 1) {
    streakBit = ` 🔥${streakInfo.streak} streak`;
  }
  return `Golf Course IQ — Day ${dayNum}\n${emoji} ${result}${streakBit}\n\nPlay → golf-iq.app`;
}
/* ═══════════════════════════════════════════════════════
   SUPABASE — Daily Course tables and helpers
   ───────────────────────────────────────────────────────
   THREE NEW TABLES NEEDED IN SUPABASE (run these once
   in the Supabase SQL editor — see SQL block at bottom).

   1. daily_plays      — every Daily Course attempt (GOAT data)
   2. monthly_streaks  — current month's public leaderboard
   3. annual_goat      — Year 1 silent tracking (no UI exposure)
   ═══════════════════════════════════════════════════════ */

const dailyDb = {
  // Log a Daily Course play. Always called whether correct or wrong.
  // Powers analytics, monthly leaderboard, and silent GOAT tracking.
  logPlay: async function({ username, dayNum, dayStr, courseId, correct, timeMs, streakAfter }) {
    try {
      await fetch(SB_URL + "/rest/v1/daily_plays", {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({
          username: normalizeUsername(username), display_name: username, day_num: dayNum, day_str: dayStr,
          course_id: courseId, correct, time_ms: timeMs,
          streak_after: streakAfter
        })
      });
    } catch(e) { console.error("daily logPlay failed:", e); }
  },

  // Check whether this user has already played today (prevents replay)
  hasPlayedToday: async function(username, dayStr) {
    try {
      const r = await fetch(
        SB_URL + "/rest/v1/daily_plays?username=eq." + encodeURIComponent(normalizeUsername(username)) +
        "&day_str=eq." + dayStr + "&select=correct,time_ms",
        { headers: SB_HEADERS }
      );
      if (!r.ok) return null;
      const rows = await r.json();
      return rows.length > 0 ? rows[0] : null;
    } catch(e) { return null; }
  },

  // Upsert into monthly streak leaderboard
  upsertMonthlyStreak: async function({ username, monthStr, currentStreak, totalTimeMs, playsThisMonth }) {
    try {
      await fetch(SB_URL + "/rest/v1/monthly_streaks", {
        method: "POST",
        headers: Object.assign({}, SB_HEADERS, { "Prefer": "resolution=merge-duplicates" }),
        body: JSON.stringify({
          username: normalizeUsername(username), display_name: username, month_str: monthStr,
          current_streak: currentStreak,
          total_time_ms: totalTimeMs,
          plays_this_month: playsThisMonth
        })
      });
    } catch(e) { console.error("monthly streak upsert failed:", e); }
  },

  // Fetch current month leaderboard, top N + caller's rank
  getMonthlyLeaderboard: async function(monthStr, username, topN) {
    topN = topN || 10;
    try {
      // Top N by streak desc, then by total_time_ms asc (tiebreaker)
      const r = await fetch(
        SB_URL + "/rest/v1/monthly_streaks?month_str=eq." + monthStr +
        "&order=current_streak.desc,total_time_ms.asc&limit=" + topN,
        { headers: SB_HEADERS }
      );
      const top = r.ok ? await r.json() : [];

      // Caller's rank: count of users with better (streak, time)
      let myRank = null;
      if (username) {
        const me = await fetch(
          SB_URL + "/rest/v1/monthly_streaks?month_str=eq." + monthStr +
          "&username=eq." + encodeURIComponent(normalizeUsername(username)) +
          "&select=current_streak,total_time_ms",
          { headers: SB_HEADERS }
        );
        const meRows = me.ok ? await me.json() : [];
        if (meRows.length > 0) {
          const myStreak = meRows[0].current_streak;
          const myTime = meRows[0].total_time_ms;
          // Count entries that beat me
          const better = await fetch(
            SB_URL + "/rest/v1/monthly_streaks?month_str=eq." + monthStr +
            "&or=(current_streak.gt." + myStreak +
            ",and(current_streak.eq." + myStreak + ",total_time_ms.lt." + myTime + "))" +
            "&select=username",
            { headers: SB_HEADERS }
          );
          const betterRows = better.ok ? await better.json() : [];
          myRank = betterRows.length + 1;
        }
      }

      return { top, myRank };
    } catch(e) {
      console.error("leaderboard fetch failed:", e);
      return { top: [], myRank: null };
    }
  },
// Fetch the last N plays for a list of usernames (for leaderboard detail)
  getRecentPlaysForUsers: async function(usernames, n) {
    n = n || 3;
    if (!usernames || usernames.length === 0) return {};
    try {
      const userFilter = usernames.map(function(u){ return '"' + u + '"'; }).join(",");
      const r = await fetch(
        SB_URL + "/rest/v1/daily_plays?username=in.(" + encodeURIComponent(userFilter) +
        ")&order=day_str.desc&select=username,day_str,correct,time_ms",
        { headers: SB_HEADERS }
      );
      if (!r.ok) return {};
      const rows = await r.json();
      const byUser = {};
      rows.forEach(function(row) {
        if (!byUser[row.username]) byUser[row.username] = [];
        if (byUser[row.username].length < n) byUser[row.username].push(row);
      });
      return byUser;
    } catch(e) { return {}; }
  },
  // SILENT — log annual GOAT progression. No UI surfaces this in Year 1.
  // Reveal happens January 2 via separate microsite.
  logAnnualPlay: async function({ username, year, dayNum, correct, timeMs }) {
    try {
      await fetch(SB_URL + "/rest/v1/annual_goat", {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({
          username: normalizeUsername(username), display_name: username, year,
          day_num: dayNum, correct,
          time_ms: timeMs
        })
      });
    } catch(e) { /* silent */ }
  },
};

/* ═══════════════════════════════════════════════════════
   SQL — Run once in Supabase SQL Editor to create tables
   ───────────────────────────────────────────────────────

   -- 1. Daily plays log (powers analytics + monthly leaderboard)
   CREATE TABLE IF NOT EXISTS daily_plays (
     id BIGSERIAL PRIMARY KEY,
     username TEXT NOT NULL,
     day_num INTEGER NOT NULL,
     day_str TEXT NOT NULL,
     course_id TEXT NOT NULL,
     correct BOOLEAN NOT NULL,
     time_ms INTEGER NOT NULL,
     streak_after INTEGER NOT NULL,
     created_at TIMESTAMPTZ DEFAULT NOW(),
     UNIQUE(username, day_str)
   );
   CREATE INDEX IF NOT EXISTS idx_dp_day ON daily_plays(day_str);
   CREATE INDEX IF NOT EXISTS idx_dp_user ON daily_plays(username);
   ALTER TABLE daily_plays ENABLE ROW LEVEL SECURITY;
   CREATE POLICY "dp_all" ON daily_plays FOR ALL USING (true) WITH CHECK (true);

   -- 2. Monthly streaks leaderboard
   CREATE TABLE IF NOT EXISTS monthly_streaks (
     username TEXT NOT NULL,
     month_str TEXT NOT NULL,
     current_streak INTEGER NOT NULL DEFAULT 0,
     total_time_ms BIGINT NOT NULL DEFAULT 0,
     plays_this_month INTEGER NOT NULL DEFAULT 0,
     updated_at TIMESTAMPTZ DEFAULT NOW(),
     PRIMARY KEY (username, month_str)
   );
   CREATE INDEX IF NOT EXISTS idx_ms_month ON monthly_streaks(month_str, current_streak DESC, total_time_ms ASC);
   ALTER TABLE monthly_streaks ENABLE ROW LEVEL SECURITY;
   CREATE POLICY "ms_all" ON monthly_streaks FOR ALL USING (true) WITH CHECK (true);

   -- 3. Annual GOAT — SILENT in Year 1, no UI exposure
   CREATE TABLE IF NOT EXISTS annual_goat (
     id BIGSERIAL PRIMARY KEY,
     username TEXT NOT NULL,
     year INTEGER NOT NULL,
     day_num INTEGER NOT NULL,
     correct BOOLEAN NOT NULL,
     time_ms INTEGER NOT NULL,
     created_at TIMESTAMPTZ DEFAULT NOW()
   );
   CREATE INDEX IF NOT EXISTS idx_ag_year_user ON annual_goat(year, username);
   ALTER TABLE annual_goat ENABLE ROW LEVEL SECURITY;
   CREATE POLICY "ag_all" ON annual_goat FOR ALL USING (true) WITH CHECK (true);

   ═══════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════
   DAILY COURSE SCREEN — One puzzle, one guess
   ───────────────────────────────────────────────────────
   Flow:
     1. Load: check if user has played today
     2. If played → show result + share + leaderboard
     3. If not → show puzzle, single guess, reveal, share
   ═══════════════════════════════════════════════════════ */

function DailyScreen({ profile, logos, dailyHistory, onComplete, onBack, onViewLeaderboard }) {
  const [phase, setPhase]         = useState("loading"); // loading | playing | sel | done
  const [todayPlay, setTodayPlay] = useState(null);  // server's record if already played
  const [course, setCourse]       = useState(null);
  const [optsData, setOptsData]   = useState(null);
  const [selectedOpt, setSel]     = useState(null);
  const [elapsed, setElapsed]     = useState(0);
  const [result, setResult]       = useState(null);  // { correct, timeMs, streakInfo }
  const [copied, setCopied]       = useState(false);
  const qStart                    = useRef(0);
  const timerRef                  = useRef(null);

  const dayStr = getETDateString();
  const dayNum = getDayNumber(dayStr);

  // Mount: check if already played today
  useEffect(() => {
    (async () => {
      const c = getCourseOfDay(dayStr);
      if (!c) { setPhase("notlive"); return; }
      setCourse(c);
      setOptsData(getDailyOptions(c, dayStr));

      // Check local history first (fast path)
      const localToday = (dailyHistory || []).find(h => h.day === dayStr);
      if (localToday) {
        const streakInfo = computeStreak(dailyHistory, dayStr);
        setResult({ correct: localToday.correct, timeMs: localToday.timeMs, streakInfo });
        setPhase("done");
        return;
      }

      // Check server (in case played on another device)
      if (profile && profile.username) {
        const remote = await dailyDb.hasPlayedToday(profile.username, dayStr);
        if (remote) {
          const streakInfo = computeStreak(dailyHistory, dayStr);
          setResult({ correct: remote.correct, timeMs: remote.time_ms, streakInfo });
          setPhase("done");
          return;
        }
      }

      // Not played — start puzzle
      qStart.current = Date.now();
      timerRef.current = setInterval(() => setElapsed(Date.now() - qStart.current), 87);
      setPhase("playing");
    })();
    return () => clearInterval(timerRef.current);
  }, []);

  const choose = (optIdx) => {
    if (phase !== "playing") return;
    clearInterval(timerRef.current);
    const t = Date.now() - qStart.current;
    const correct = optIdx === optsData.ansIdx;
    setSel(optIdx);
    setPhase("sel");
    playClick();

    setTimeout(async () => {
      correct ? playCupIn() : playWrong();

      // Build new history entry
      const entry = { day: dayStr, dayNum, courseId: course.id, correct, timeMs: t };
      const newHistory = [...(dailyHistory || []), entry];
      const streakInfo = computeStreak(newHistory, dayStr);

      setResult({ correct, timeMs: t, streakInfo });
      setPhase("done");

      // Persist locally
      onComplete(entry, streakInfo);

      // Persist to Supabase
      if (profile && profile.username) {
        await dailyDb.logPlay({
          username: profile.username,
          dayNum, dayStr,
          courseId: course.id,
          correct, timeMs: t,
          streakAfter: streakInfo.streak
        });

        // Silent annual GOAT logging
        const year = parseInt(dayStr.slice(0, 4), 10);
        dailyDb.logAnnualPlay({
          username: profile.username,
          year, dayNum, correct, timeMs: t
        });

        // Update monthly leaderboard
        const monthStr = dayStr.slice(0, 7);
        const monthHistory = newHistory.filter(h => h.day.startsWith(monthStr));
        const monthTimeMs = monthHistory.reduce((s, h) => s + h.timeMs, 0);
        dailyDb.upsertMonthlyStreak({
          username: profile.username,
          monthStr,
          currentStreak: streakInfo.streak,
          totalTimeMs: monthTimeMs,
          playsThisMonth: monthHistory.length
        });
      }
    }, 480);
  };

  const optState = (i) => {
    if (phase === "playing") return "idle";
    if (phase === "sel")     return i === selectedOpt ? "sel" : "idle";
    if (i === optsData.ansIdx) return "ok";
    if (i === selectedOpt)     return "bad";
    return "idle";
  };

  const shareText = result ? generateDailyShare(dayNum, result.timeMs, result.correct, result.streakInfo) : "";

  const copy = async () => {
    try { await navigator.clipboard.writeText(shareText); setCopied(true); setTimeout(()=>setCopied(false), 2200); }
    catch(e) { alert(shareText); }
  };

  // ── LOADING ──
  if (phase === "loading") {
    return (
      <div className="gi-app" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
        <div className="gi-stars"/>
        <div style={{fontSize:14,color:"rgba(200,168,75,.4)",letterSpacing:".2em"}}>LOADING DAILY…</div>
      </div>
    );
  }

  // ── PRE-LAUNCH ──
  if (phase === "notlive") {
    return (
      <div className="gi-app" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div className="gi-stars"/>
        <div className="gi-screen" style={{maxWidth:420,padding:"32px 24px",textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:12}}>⛳</div>
          <div className="gi-serif gi-gold" style={{fontSize:28,fontWeight:900}}>Daily Course</div>
          <div style={{color:"rgba(200,180,140,.6)",fontSize:14,marginTop:12}}>
            The Daily Course launches {DAILY_EPOCH}.
          </div>
          <button className="gi-btn gi-btn-outline" onClick={onBack} style={{marginTop:24}}>← BACK</button>
        </div>
      </div>
    );
  }

  // ── PLAYING ──
  if (phase === "playing" || phase === "sel") {
    const isOver6s = elapsed > 6000;
    return (
      <div className="gi-app" style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
        <div className="gi-stars"/>
        <div className="gi-screen" style={{flex:1,display:"flex",flexDirection:"column",maxWidth:520,margin:"0 auto",width:"100%",padding:"18px 16px",gap:14}}>

          {/* Header */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← BACK</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700}}>DAILY COURSE</div>
              <div className="gi-serif gi-gold" style={{fontSize:20,fontWeight:700,lineHeight:1}}>Day {dayNum}</div>
            </div>
            <div className={`gi-timer ${isOver6s?"gi-timer-fast":""}`} style={{fontSize:20}}>{fmtFull(elapsed)}</div>
          </div>

          {/* Logo */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"20px 0",position:"relative",flex:1,justifyContent:"center"}}>
            <div className="gi-spotlight" style={{width:280,height:280}}/>
            <div className="gi-logo-ring" style={{width:168,height:168,position:"relative",zIndex:1}}>
              <CourseLogo course={course} size={168} uploadedData={logos && logos[course.id]}/>
            </div>
            <div style={{marginTop:18,textAlign:"center",position:"relative",zIndex:1}}>
              <div style={{fontSize:13,color:"rgba(200,180,140,.5)",letterSpacing:".06em"}}>
                One puzzle. One guess. No do-overs.
              </div>
            </div>
          </div>

          {/* Options */}
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {optsData.opts.map((opt, i) => (
              <OptBtn key={opt.id} letter={"ABCD"[i]} option={opt}
                state={optState(i)} onClick={()=>choose(i)} disabled={phase!=="playing"}/>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── DONE ──
  const streak = result.streakInfo;
  const msg = result.correct
    ? streak.streak >= 7 ? "🔥 ON FIRE"
    : streak.streak >= 3 ? "🎯 DIALED IN"
    : "⛳ WELL PLAYED"
    : "💨 SAND TRAP";

  return (
    <div className="gi-app" style={{minHeight:"100vh"}}>
      <div className="gi-stars"/>
      <div className="gi-screen" style={{maxWidth:480,margin:"0 auto",padding:"24px 16px",display:"flex",flexDirection:"column",gap:18}}>

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← HOME</button>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700}}>DAILY COURSE</div>
            <div className="gi-serif gi-gold" style={{fontSize:18,fontWeight:700,lineHeight:1}}>Day {dayNum}</div>
          </div>
        </div>

        {/* Result card */}
        <div className="gi-card" style={{padding:"20px",textAlign:"center"}}>
          <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700,marginBottom:8}}>{msg}</div>
          <CourseLogo course={course} size={120} uploadedData={logos && logos[course.id]}/>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700,marginTop:14,color:"#f0dfa0"}}>
            {course.name}
          </div>
          <div style={{fontSize:13,color:"rgba(200,180,140,.6)",marginTop:4}}>📍 {course.loc}</div>

          <div style={{display:"flex",gap:24,justifyContent:"center",marginTop:18,paddingTop:14,
            borderTop:"1px solid rgba(200,168,75,.15)"}}>
            <div>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:24,color:"#f0dfa0"}}>{fmtFull(result.timeMs)}</div>
              <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".1em"}}>YOUR TIME</div>
            </div>
            <div style={{width:1,background:"rgba(200,168,75,.2)"}}/>
            <div>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:24,
                color: streak.state==="active" ? "#f0dfa0" : streak.state==="paused" ? "#888" : "#666"}}>
                {streak.streak > 0 ? "🔥" + streak.streak : "—"}
              </div>
              <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".1em"}}>
                {streak.state==="paused" ? "PAUSED" : "STREAK"}
              </div>
            </div>
          </div>

          {streak.state === "paused" && (
            <div style={{marginTop:14,padding:"10px 14px",background:"rgba(100,100,100,.15)",
              borderRadius:6,fontSize:12,color:"rgba(200,200,200,.7)",fontStyle:"italic"}}>
              Your {streak.streak}-day streak is paused. Play tomorrow to keep it alive.
            </div>
          )}
        </div>

        {/* Actions */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <button className="gi-btn gi-btn-gold" style={{width:"100%",fontSize:16,padding:"15px"}} onClick={copy}>
            {copied ? "✓ COPIED!" : "📋 SHARE TODAY'S RESULT"}
          </button>
          <button className="gi-btn gi-btn-outline" onClick={onViewLeaderboard}>
            🏆 THIS MONTH'S LEADERBOARD
          </button>
        </div>

        <div style={{textAlign:"center",fontSize:11,color:"rgba(200,168,75,.35)",letterSpacing:".06em",marginTop:6}}>
          Come back tomorrow at midnight ET for a new course.
        </div>
      </div>
    </div>
  );
}

function GolfIQ() {
  const [screen, setScreen]       = useState("loading");
  const [profile, setProfile]     = useState(null);
  const [history, setHistory]     = useState([]);
  const [trophies, setTrophies]   = useState(new Set());
  const [currentGame, setGame]    = useState(null);
  const [gameResult, setResult]   = useState(null);
  const [newTrophies, setNewTr]   = useState([]);
  const [logos, setLogos]         = useState({});
  const lastGameTs                = useRef(null);
  const [dailyHistory, setDailyHistory] = useState([]);  

  // Load persisted data
  useEffect(() => {
    (async () => {
      const [p, h, tr, dh] = await Promise.all([S.get("gp-profile"), S.get("gp-history"), S.get("gp-trophies"), S.get("gp-daily-history")]);
      if (p) setProfile(p);
      if (h) setHistory(h);
      if (tr) setTrophies(new Set(tr));
      if (dh) setDailyHistory(dh);
      // Load logos from Supabase
      const logoData = await db.loadAll();
      if (Object.keys(logoData).length > 0) setLogos(logoData);
      setScreen(p ? "home" : "setup");
    })();
  }, []);

  const saveLogo = function(id, dataUrl, silent) {
    var img = new Image();
    img.onload = function() {
      var MAX = 160;
      var scale = Math.min(MAX / img.width, MAX / img.height, 1);
      var canvas = document.createElement("canvas");
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      // Try progressively lower quality until small enough
      var small = canvas.toDataURL("image/jpeg", 0.7);
      if (small.length > 51200) small = canvas.toDataURL("image/jpeg", 0.5);
      if (small.length > 51200) small = canvas.toDataURL("image/jpeg", 0.3);
      if (small.length > 51200) {
        alert("Image too large even after compression (" + Math.round(small.length/1024) + "KB). Try a simpler/smaller image.");
        return;
      }
      setLogos(function(prev){ return Object.assign({}, prev, {[id]: small}); });
      if (!silent) db.save(id, small);
    };
    img.onerror = function() { alert("Could not read image."); };
    img.src = dataUrl;
  };

  const removeLogo = (id) => {
    db.remove(id);
    setLogos(prev => {
      const n = Object.assign({}, prev);
      delete n[id];
      return n;
    });
  };

  const stats = calcStats(history);

  const saveProfile = async (p) => { setProfile(p); await S.set("gp-profile", p); setScreen("home"); };

  const startGame = () => {
    const quick = lastGameTs.current && Date.now() - lastGameTs.current < 30*60*1000;
    setGame(makeGame()); setScreen("playing");
  };

  const onDailyComplete = async (entry, streakInfo) => {
  const newDaily = [...dailyHistory, entry];
  setDailyHistory(newDaily);
  await S.set("gp-daily-history", newDaily);
};
  const onGameComplete = async ({ results, times, picked }) => {
    lastGameTs.current = Date.now();
    const gameRecord = { results, times, picked, totalMs: times.reduce((a,b)=>a+b,0), ts: Date.now() };
    const newHistory = [...history, gameRecord];

    // Quick return check
    const hadQuick = history.length > 0 && (Date.now() - history[history.length-1].ts < 30*60*1000);
    const augmentedStats = calcStats(newHistory);
    if (hadQuick) augmentedStats.quickReturn = true;

    const { earned, newOnes } = checkTrophies(augmentedStats, trophies);

    setHistory(newHistory);
    setTrophies(earned);
    setResult({ results, times, picked });
    setNewTr(newOnes);
    setScreen("results");

    await Promise.all([S.set("gp-history", newHistory), S.set("gp-trophies", [...earned])]);
  };

  if (screen === "loading") return (
    <div className="gi-app" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <style>{css}</style>
      <div className="gi-stars"/>
      <div style={{fontSize:14,color:"rgba(200,168,75,.4)",letterSpacing:".2em"}}>LOADING…</div>
    </div>
  );

  return (
    <>
      <style>{css}</style>
      {screen === "setup"    && <SetupScreen onSave={saveProfile}/>}
      {screen === "home"     && <HomeScreen profile={profile} stats={stats} trophyCount={trophies.size} dailyStreak={computeStreak(dailyHistory)} dailyPlayedToday={dailyHistory.some(h => h.day === getETDateString())} onPlay={startGame} onDaily={()=>setScreen("daily")} onStats={()=>setScreen("stats")} onTrophies={()=>setScreen("trophies")} onEditProfile={()=>setScreen("setup")} onAdmin={()=>setScreen("admin")}/>}      {screen === "playing"  && <GameScreen game={currentGame} profile={profile} logos={logos} onSaveLogo={saveLogo} onComplete={onGameComplete}/>}
      {screen === "results"  && <ResultsScreen game={currentGame} results={gameResult.results} times={gameResult.times} picked={gameResult.picked} profile={profile} stats={stats} newTrophies={newTrophies} onPlayAgain={startGame} onHome={()=>setScreen("home")}/>}
      {screen === "stats"    && <StatsScreen stats={stats} history={history} onBack={()=>setScreen("home")}/>}
      {screen === "trophies" && <TrophiesScreen earned={trophies} onBack={()=>setScreen("home")}/>}
      {screen === "daily"       && <DailyScreen profile={profile} logos={logos} dailyHistory={dailyHistory} onComplete={onDailyComplete} onBack={()=>setScreen("home")} onViewLeaderboard={()=>setScreen("leaderboard")}/>}
      {screen === "leaderboard" && <LeaderboardScreen profile={profile} onBack={()=>setScreen("daily")}/>}
      {screen === "admin"    && <AdminScreen logos={logos} onSaveLogo={saveLogo} onRemoveLogo={removeLogo} onBack={()=>setScreen("home")}/>}
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GolfIQ />);
  </script>
</body>
</html>
