const db = {
  loadAll: async function() {
    // Retry transient failures. A single failed fetch otherwise leaves the logo
    // map empty for the entire session, so every course falls back to its crest
    // symbol (the "missing logo" bug). Flaky mobile networks trigger this.
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        const r = await fetch(SB_URL + "/rest/v1/logos?select=course_id,data", { headers: SB_HEADERS });
        if (r.ok) {
          const rows = await r.json();
          const result = {};
          rows.forEach(function(row) { result[row.course_id] = row.data; });
          return result;
        }
      } catch(e) { /* fall through to retry */ }
      await new Promise(function(res){ setTimeout(res, 400 * (attempt + 1)); });
    }
    console.error("Supabase loadAll failed after 3 attempts — logos unavailable this session.");
    return {};
  },
  save: async function(id, dataUrl) {
    try {
      const r = await fetch(SB_URL + "/rest/v1/logos", {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({ course_id: id, data: dataUrl })
      });
      if (!r.ok) {
        const txt = await r.text();
        console.error("Supabase save failed:", r.status, txt);
        alert("⚠️ Logo did NOT save to the cloud (error " + r.status + "). It's only showing on this device right now — please re-try the upload.");
      }
    } catch(e) { console.error("Supabase network error:", e.message); }
  },
  remove: async function(id) {
    try {
      await fetch(SB_URL + "/rest/v1/logos?course_id=eq." + id, {
        method: "DELETE",
        headers: SB_HEADERS
      });
    } catch(e) {}
  }
};

/* ═══════════════════════════════════════════════════════
   AUDIO ENGINE — authentic golf sounds via Web Audio API
═══════════════════════════════════════════════════════ */
let _audioCtx = null;
function ctx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === "suspended") _audioCtx.resume();
  return _audioCtx;
}

// Crisp iron strike: sharp transient impact + metallic ring + brief ball-flight hiss
function playClick() {
  try {
    const c = ctx(), t = c.currentTime, sr = c.sampleRate;

    // ── Impact transient (8ms of shaped noise — the "tock" of clubface)
    const impLen = Math.floor(sr * 0.009);
    const impBuf = c.createBuffer(1, impLen, sr);
    const impD = impBuf.getChannelData(0);
    for (let i = 0; i < impLen; i++) {
      const env = Math.pow(1 - i / impLen, 1.6);
      impD[i] = (Math.random() * 2 - 1) * env;
    }
    const imp = c.createBufferSource(); imp.buffer = impBuf;
    const impFilt = c.createBiquadFilter(); impFilt.type = "bandpass";
    impFilt.frequency.value = 4200; impFilt.Q.value = 0.7;
    const impG = c.createGain(); impG.gain.setValueAtTime(0.75, t);
    imp.connect(impFilt); impFilt.connect(impG); impG.connect(c.destination);
    imp.start(t);

    // ── Metallic ring — iron face resonance (high chirp sweeping down)
    const ring = c.createOscillator(); ring.type = "sine";
    const ringG = c.createGain();
    ring.frequency.setValueAtTime(3200, t);
    ring.frequency.exponentialRampToValueAtTime(1600, t + 0.06);
    ring.frequency.exponentialRampToValueAtTime(800,  t + 0.16);
    ringG.gain.setValueAtTime(0.14, t);
    ringG.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    ring.connect(ringG); ringG.connect(c.destination);
    ring.start(t); ring.stop(t + 0.2);

    // ── Low body thud (the feel of the strike)
    const body = c.createOscillator(); body.type = "triangle";
    const bodyG = c.createGain();
    body.frequency.setValueAtTime(380, t);
    body.frequency.exponentialRampToValueAtTime(180, t + 0.09);
    bodyG.gain.setValueAtTime(0.10, t);
    bodyG.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    body.connect(bodyG); bodyG.connect(c.destination);
    body.start(t); body.stop(t + 0.13);

    // ── Ball-flight hiss (very faint, fades in after impact)
    const hissLen = Math.floor(sr * 0.18);
    const hissBuf = c.createBuffer(1, hissLen, sr);
    const hissD = hissBuf.getChannelData(0);
    for (let i = 0; i < hissLen; i++) {
      const env = (i / hissLen) * Math.pow(1 - i / hissLen, 2.0);
      hissD[i] = (Math.random() * 2 - 1) * env;
    }
    const hiss = c.createBufferSource(); hiss.buffer = hissBuf;
    const hissFilt = c.createBiquadFilter(); hissFilt.type = "highpass"; hissFilt.frequency.value = 5000;
    const hissG = c.createGain(); hissG.gain.setValueAtTime(0.07, t + 0.01);
    hiss.connect(hissFilt); hissFilt.connect(hissG); hissG.connect(c.destination);
    hiss.start(t + 0.01);
  } catch(_) {}
}

// Ball dropping into cup: hollow "tok" on edge, then the iconic rattle-settle
function playCupIn() {
  try {
    const c = ctx(), t = c.currentTime, sr = c.sampleRate;

    // ── First contact — ball hits cup edge (hollow, wooden-plastic quality)
    const tok1 = c.createOscillator(); tok1.type = "sine";
    const tok1G = c.createGain();
    tok1.frequency.setValueAtTime(560, t);
    tok1.frequency.exponentialRampToValueAtTime(290, t + 0.09);
    tok1G.gain.setValueAtTime(0.28, t);
    tok1G.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    tok1.connect(tok1G); tok1G.connect(c.destination);
    tok1.start(t); tok1.stop(t + 0.16);

    // Second harmonic for richness
    const tok1b = c.createOscillator(); tok1b.type = "sine";
    const tok1bG = c.createGain();
    tok1b.frequency.setValueAtTime(1120, t);
    tok1b.frequency.exponentialRampToValueAtTime(580, t + 0.07);
    tok1bG.gain.setValueAtTime(0.09, t);
    tok1bG.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    tok1b.connect(tok1bG); tok1bG.connect(c.destination);
    tok1b.start(t); tok1b.stop(t + 0.1);

    // ── Bottom of cup impact (slightly lower, 85ms later)
    const tok2 = c.createOscillator(); tok2.type = "sine";
    const tok2G = c.createGain();
    tok2.frequency.setValueAtTime(420, t + 0.085);
    tok2.frequency.exponentialRampToValueAtTime(200, t + 0.085 + 0.1);
    tok2G.gain.setValueAtTime(0.22, t + 0.085);
    tok2G.gain.exponentialRampToValueAtTime(0.001, t + 0.085 + 0.16);
    tok2.connect(tok2G); tok2G.connect(c.destination);
    tok2.start(t + 0.085); tok2.stop(t + 0.28);

    // ── Rattle/settle — the ball rolling around the cup bottom
    const rattleLen = Math.floor(sr * 0.22);
    const rattleBuf = c.createBuffer(1, rattleLen, sr);
    const rattleD = rattleBuf.getChannelData(0);
    for (let i = 0; i < rattleLen; i++) {
      // Bursting, irregular — simulates ball bouncing inside
      const burst = Math.sin(i * 0.004) * Math.sin(i * 0.017) * Math.sin(i * 0.031);
      const env = Math.pow(1 - i / rattleLen, 1.2);
      rattleD[i] = (Math.random() * 2 - 1) * Math.abs(burst) * env * 0.9;
    }
    const rattle = c.createBufferSource(); rattle.buffer = rattleBuf;
    const rattleFilt = c.createBiquadFilter(); rattleFilt.type = "bandpass";
    rattleFilt.frequency.value = 1400; rattleFilt.Q.value = 1.8;
    const rattleG = c.createGain();
    rattleG.gain.setValueAtTime(0.22, t + 0.16);
    rattleG.gain.exponentialRampToValueAtTime(0.001, t + 0.44);
    rattle.connect(rattleFilt); rattleFilt.connect(rattleG); rattleG.connect(c.destination);
    rattle.start(t + 0.16);
  } catch(_) {}
}

// Sand explosion: burst of shaped noise = ball hitting a bunker
function playWrong() {
  try {
    const c = ctx(), t = c.currentTime, sr = c.sampleRate;

    // ── Sandy explosion — shaped noise with fast attack, slow decay
    const dur = 0.38;
    const sandLen = Math.floor(sr * dur);
    const sandBuf = c.createBuffer(1, sandLen, sr);
    const sandD = sandBuf.getChannelData(0);
    for (let i = 0; i < sandLen; i++) {
      const attackEnd = Math.floor(sr * 0.018);
      const env = i < attackEnd
        ? i / attackEnd
        : Math.pow(1 - (i - attackEnd) / (sandLen - attackEnd), 0.75);
      sandD[i] = (Math.random() * 2 - 1) * env;
    }
    const sand = c.createBufferSource(); sand.buffer = sandBuf;
    // Band-limited to sound granular, not just white noise
    const sandFilt = c.createBiquadFilter(); sandFilt.type = "bandpass";
    sandFilt.frequency.value = 900; sandFilt.Q.value = 0.55;
    const sandG = c.createGain(); sandG.gain.setValueAtTime(0.32, t);
    sand.connect(sandFilt); sandFilt.connect(sandG); sandG.connect(c.destination);
    sand.start(t);

    // Low-frequency thud of ball hitting the sand
    const thud = c.createOscillator(); thud.type = "sine";
    const thudG = c.createGain();
    thud.frequency.setValueAtTime(160, t);
    thud.frequency.exponentialRampToValueAtTime(55, t + 0.13);
    thudG.gain.setValueAtTime(0.22, t);
    thudG.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    thud.connect(thudG); thudG.connect(c.destination);
    thud.start(t); thud.stop(t + 0.2);

    // Brief high splatter (the sand grains hitting the surface)
    const splatLen = Math.floor(sr * 0.08);
    const splatBuf = c.createBuffer(1, splatLen, sr);
    const splatD = splatBuf.getChannelData(0);
    for (let i = 0; i < splatLen; i++) splatD[i] = (Math.random() * 2 - 1) * (1 - i/splatLen);
    const splat = c.createBufferSource(); splat.buffer = splatBuf;
    const splatFilt = c.createBiquadFilter(); splatFilt.type = "highpass"; splatFilt.frequency.value = 3500;
    const splatG = c.createGain(); splatG.gain.setValueAtTime(0.10, t + 0.02);
    splat.connect(splatFilt); splatFilt.connect(splatG); splatG.connect(c.destination);
    splat.start(t + 0.02);
  } catch(_) {}
}

/* ═══════════════════════════════════════════════════════
   GAME FACTORY
═══════════════════════════════════════════════════════ */
function makeGame(pool = ALL_COURSES) {
  const shuffled = [...pool].sort(() => Math.random() - .5);
  const picks = shuffled.slice(0, 5);
  return picks.map(correct => {
    const others = ALL_COURSES.filter(c => c.id !== correct.id).sort(() => Math.random() - .5).slice(0, 3);
    const opts = [...others, correct].sort(() => Math.random() - .5);
    return { correct, opts, ansIdx: opts.findIndex(o => o.id === correct.id) };
  });
}

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
const fmt = ms => ms < 1000 ? `${ms}ms` : `${(ms/1000).toFixed(1)}s`;
const fmtFull = ms => (ms/1000).toFixed(2) + "s";

function calcStats(history) {
  if (!history.length) return { games:0, correct:0, total:0, correctRate:0, perfect:0, maxStreak:0, bestTime:null, fastestAnswer:null, perfectFastGame:null, quickReturn:false };
  let correct=0, total=0, perfect=0, streak=0, maxStreak=0, bestTime=null, fastestAnswer=null, perfectFastGame=null, quickReturn=false;
  history.forEach((g, i) => {
    const score = g.results.filter(Boolean).length;
    correct += score; total += 5;
    if (score === 5) { perfect++; streak++; maxStreak = Math.max(maxStreak, streak); if (!bestTime || g.totalMs < bestTime) bestTime = g.totalMs; if (g.totalMs < 20000) perfectFastGame = g.totalMs; }
    else streak = 0;
    g.times.forEach(t => { if (g.results[g.times.indexOf(t)]) { if (!fastestAnswer || t < fastestAnswer) fastestAnswer = t; } });
    if (i > 0) { const prev = history[i-1]; if (g.ts - prev.ts < 30*60*1000) quickReturn = true; }
  });
  return { games:history.length, correct, total, correctRate: total ? Math.round(correct/total*100) : 0, perfect, maxStreak, bestTime, fastestAnswer, perfectFastGame, quickReturn };
}

function checkTrophies(stats, prevTrophySet) {
  const earned = new Set(prevTrophySet);
  const newOnes = [];
  TROPHY_DEFS.forEach(t => {
    if (!earned.has(t.id) && t.check(stats)) { earned.add(t.id); newOnes.push(t); }
  });
  return { earned, newOnes };
}

function generateShare(game, results, times, profile, stats) {
  const score = results.filter(Boolean).length;
  const total = times.reduce((a,b)=>a+b,0);
  const emojis = results.map(r => r ? "✅" : "❌").join("");
  const lines = [
    `⛳ Golf Course IQ`,
    profile.username ? `🏌️ @${profile.username}${profile.tagline ? ` · "${profile.tagline}"` : ""}` : "",
    ``,
    `${emojis}`,
    `📊 ${score}/5 correct · ⏱️ ${fmtFull(total)} total`,
    ``,
    ...game.map((q,i) => {
      const picked = q.opts.find((_, oi) => oi === (results[i] ? q.ansIdx : game[i]._picked));
      return `${results[i]?"✅":"❌"} Q${i+1}: ${q.correct.name} (${fmtFull(times[i])})`;
    }),
    ``,
    `🏅 All-time: ${stats.correctRate}% · ${stats.games} game${stats.games!==1?"s":""}`,
    ``,
    `Play Golf Course IQ → golf-iq.app`,
  ].filter(l => l !== undefined);
  return lines.join("\n");
}

/* ═══════════════════════════════════════════════════════
   CLUB CREST — SVG heraldic badge rendered when no logo loads.
   Looks like an actual embroidered club crest, not letters.
═══════════════════════════════════════════════════════ */
function ClubCrest({ course, size }) {
  const r = size / 2;
  const numDots = 16;
  // Outer decorative ring dots
  const dots = Array.from({ length: numDots }, (_, i) => {
    const angle = (i / numDots) * Math.PI * 2 - Math.PI / 2;
    return {
      x: r + (r - 7) * Math.cos(angle),
      y: r + (r - 7) * Math.sin(angle),
    };
  });
  // Crossed clubs path (simplified SVG paths centered on r,r)
  const sc = size / 100; // scale factor
  const cx = r, cy = r;

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:"block" }}>
      <defs>
        <radialGradient id={`bg-${course.id}`} cx="40%" cy="35%">
          <stop offset="0%" stopColor={course.col} stopOpacity="1" />
          <stop offset="100%" stopColor={`${course.col}88`} stopOpacity="1" />
        </radialGradient>
        <radialGradient id={`sheen-${course.id}`} cx="38%" cy="28%">
          <stop offset="0%" stopColor="rgba(255,255,255,0.18)" />
          <stop offset="60%" stopColor="rgba(255,255,255,0)" />
        </radialGradient>
      </defs>

      {/* Background circle */}
      <circle cx={r} cy={r} r={r - 1} fill={`url(#bg-${course.id})`} />

      {/* Sheen highlight */}
      <circle cx={r} cy={r} r={r - 1} fill={`url(#sheen-${course.id})`} />

      {/* Outer gold ring */}
      <circle cx={r} cy={r} r={r - 2} fill="none" stroke="rgba(200,168,75,0.75)" strokeWidth="2" />

      {/* Inner decorative ring */}
      <circle cx={r} cy={r} r={r * 0.78} fill="none" stroke="rgba(200,168,75,0.3)" strokeWidth="1" strokeDasharray="3 2.5" />

      {/* Decorative dots on outer ring */}
      {dots.map((d, i) => (
        <circle key={i} cx={d.x} cy={d.y} r={i % 4 === 0 ? 2 : 1.2}
          fill={i % 4 === 0 ? "rgba(200,168,75,0.85)" : "rgba(200,168,75,0.4)"} />
      ))}

      {/* Course symbol emoji — prominent, centered */}
      {course.sym
        ? <>
            <text
              x={r} y={cy + r * 0.18}
              textAnchor="middle" dominantBaseline="middle"
              fontSize={size * 0.38}
              style={{ userSelect:"none" }}
            >
              {course.sym}
            </text>
            {/* Club initials below emoji */}
            <text
              x={r} y={cy + r * 0.72}
              textAnchor="middle"
              fontSize={course.init.length > 3 ? size * 0.105 : course.init.length > 2 ? size * 0.12 : size * 0.135}
              fontFamily="'Playfair Display', Georgia, serif"
              fontWeight="700"
              fill="rgba(255,220,120,0.9)"
              letterSpacing="1.5"
            >
              {course.init}
            </text>
          </>
        : <>
            {/* Fallback: golf flag + initials */}
            <line x1={cx - 2} y1={cy - r * 0.36} x2={cx - 2} y2={cy + r * 0.32}
              stroke="rgba(220,195,110,0.9)" strokeWidth={1.6 * sc * 2} strokeLinecap="round" />
            <polygon
              points={`${cx - 1},${cy - r * 0.36} ${cx + r * 0.26},${cy - r * 0.22} ${cx - 1},${cy - r * 0.06}`}
              fill="rgba(200,168,75,0.9)" />
            <ellipse cx={cx - 2} cy={cy + r * 0.34} rx={r * 0.16} ry={r * 0.045}
              fill="rgba(0,0,0,0.25)" />
            <text
              x={r} y={cy + r * 0.61}
              textAnchor="middle"
              fontSize={course.init.length > 3 ? size * 0.115 : course.init.length > 2 ? size * 0.135 : size * 0.155}
              fontFamily="'Playfair Display', Georgia, serif"
              fontWeight="700"
              fill="rgba(255,220,120,0.95)"
              letterSpacing="1.5"
            >
              {course.init}
            </text>
          </>
      }

      {/* Thin gold baseline under initials */}
      <line
        x1={r - r * 0.32} y1={cy + r * 0.78}
        x2={r + r * 0.32} y2={cy + r * 0.78}
        stroke="rgba(200,168,75,0.4)" strokeWidth="0.8"
      />
    </svg>
  );
}

═══════════════════════════════════════════════════════ */
function OptBtn({ letter, option, state, onClick, disabled }) {
  const cls = { idle:"gi-opt-idle", sel:"gi-opt-sel", ok:"gi-opt-ok", bad:"gi-opt-bad", dim:"gi-opt-dim" };
  const icons = { ok:"✓", bad:"✗" };
  const rippleRef = useRef(null);

  const handleClick = (e) => {
    if (disabled || state !== "idle") return;
    // Ripple
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const rip = document.createElement("div");
    rip.className = "gi-ripple";
    rip.style.left = `${e.clientX - rect.left}px`;
    rip.style.top  = `${e.clientY - rect.top}px`;
    btn.appendChild(rip);
    setTimeout(() => rip.remove(), 650);
    onClick();
  };

  return (
    <button className={`gi-opt ${cls[state]||"gi-opt-idle"}`}
      onClick={handleClick} disabled={disabled || state==="dim"} style={{position:"relative",overflow:"hidden"}}>
      <div className="gi-opt-inner">
        <span className="gi-opt-letter">{letter}</span>
        <div className="gi-opt-sep" />
        <span className="gi-opt-text">
          <span style={{fontWeight:600}}>{option.name}</span>
          <br/>
          <span style={{fontSize:12,opacity:.7,fontWeight:400}}>📍 {option.loc}</span>
        </span>
        {(state==="ok"||state==="bad") && <span className="gi-opt-icon">{icons[state]}</span>}
      </div>
    </button>
  );
}

  const [phase, setPhase]       = useState("idle"); // idle | sel | done
  const [selectedOpt, setSel]   = useState(null);
  const [elapsed, setElapsed]   = useState(0);
  const [totalMs, setTotalMs]   = useState(0);
  const [penalties, setPenalties] = useState(0);
  const qStart    = useRef(Date.now());
  const timerRef  = useRef(null);

  const q = courses[qIdx];

  // Build options for current question (same deterministic logic as daily)
  const optsData = React.useMemo(() => {
    if (!q) return null;
    return getDailyOptions(q, dateStr + "-sprint-" + qIdx);
  }, [qIdx]);

  useEffect(() => {
    qStart.current = Date.now();
    setElapsed(0);
    timerRef.current = setInterval(() => setElapsed(Date.now() - qStart.current), 87);
    return () => clearInterval(timerRef.current);
  }, [qIdx]);

  const choose = (optIdx) => {
    if (phase !== "idle" || !optsData) return;
    clearInterval(timerRef.current);
    const t = Date.now() - qStart.current;
    const correct = optIdx === optsData.ansIdx;
    setSel(optIdx);
    setPhase("sel");
    correct ? playClick() : playWrong();

    setTimeout(() => {
      const newAnswers = [...answers, { correct, picked: optIdx, timeMs: t, course: q, optsData }];
      const newTotal = totalMs + t;
      const newPenalties = penalties + (correct ? 0 : SPRINT_PENALTY_MS);
      setAnswers(newAnswers);
      setTotalMs(newTotal);
      setPenalties(newPenalties);

      if (qIdx < courses.length - 1) {
        setQIdx(i => i + 1);
        setSel(null);
        setPhase("idle");
      } else {
        // Sprint complete
        const correctCount = newAnswers.filter(a => a.correct).length;
        onComplete({
          answers: newAnswers,
          totalMs: newTotal,
          penaltyMs: newPenalties,
          adjustedMs: newTotal + newPenalties,
          correctCount,
          courseIds: courses.map(c => c.id),
          dateStr
        });
      }
    }, 350);
  };

  const optState = (i) => {
    if (phase === "idle") return "idle";
    if (phase === "sel")  return i === selectedOpt ? "sel" : "idle";
    return "idle"; // pressure cooker — no reveal mid-round
  };

  const isOver6s = elapsed > 6000;
  const penaltyCount = penalties / SPRINT_PENALTY_MS;

  return (
    <div className="gi-app" style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div className="gi-stars"/>
      <div className="gi-screen" style={{flex:1,display:"flex",flexDirection:"column",maxWidth:520,
        margin:"0 auto",width:"100%",padding:"18px 16px",gap:14}}>

        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← BACK</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700}}>FRIEND BATTLE</div>
            <div className="gi-serif gi-gold" style={{fontSize:16,fontWeight:700,lineHeight:1}}>
              {qIdx + 1} of {courses.length}
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div className={`gi-timer ${isOver6s ? "gi-timer-fast" : ""}`} style={{fontSize:20}}>{fmtFull(elapsed)}</div>
            {penaltyCount > 0 && (
              <div style={{fontSize:10,color:"#e04040",letterSpacing:".06em"}}>+{penaltyCount * 10}s penalty</div>
            )}
          </div>
        </div>

        {/* Progress dots */}
        <div style={{display:"flex",gap:6,justifyContent:"center"}}>
          {courses.map((_, i) => (
            <div key={i} className={`gi-dot ${
              i < qIdx ? (answers[i] && answers[i].correct ? "gi-dot-correct" : "gi-dot-wrong")
              : i === qIdx ? "gi-dot-active" : ""
            }`}/>
          ))}
        </div>

        {/* Logo */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",
          padding:"16px 0",position:"relative",flex:1,justifyContent:"center"}}>
          <div className="gi-spotlight" style={{width:260,height:260}}/>
          <div className="gi-logo-ring" style={{width:156,height:156,position:"relative",zIndex:1}}>
            <CourseLogo course={q} size={156} uploadedData={logos && logos[q.id]}/>
          </div>
          <div style={{marginTop:14,textAlign:"center",position:"relative",zIndex:1}}>
            <div style={{fontSize:12,color:"rgba(200,180,140,.45)",letterSpacing:".06em"}}>
              Wrong answers add 10s. No peeking at the answers.
            </div>
          </div>
        </div>

        {/* Options */}
        {optsData && (
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {optsData.opts.map((opt, i) => (
              <OptBtn key={opt.id} letter={"ABCD"[i]} option={opt}
                state={optState(i)} onClick={() => choose(i)} disabled={phase !== "idle"}/>
            ))}
          </div>
        )}

        {/* Running total */}
        <div style={{textAlign:"center",fontSize:12,color:"rgba(200,168,75,.3)",letterSpacing:".08em"}}>
          ⏱ RUNNING: {fmtFull(totalMs + elapsed)}
          {penalties > 0 && <span style={{color:"rgba(220,80,80,.5)"}}> + {fmtFull(penalties)} penalty</span>}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════

  const [fieldData, setFieldData]   = useState(null);

  const [copied, setCopied]         = useState(false);
  const [showJoin, setShowJoin]     = useState(false);
  const [showCreate, setShowCreate] = useState(false);
  const [clubCode, setClubCode]     = useState("");
  const [clubName, setClubName]     = useState("");
  const [clubMsg, setClubMsg]       = useState("");

  const dateStr = result.dateStr;
  const adjSec  = ((result.adjustedMs) / 1000).toFixed(1);
  const rawSec  = (result.totalMs / 1000).toFixed(1);
  const penSec  = (result.penaltyMs / 1000).toFixed(0);
  const perfect = result.correctCount === 7;

  useEffect(() => {
    (async () => {
      // Fetch The Field + personal clubs in parallel
      const [field, myClubs] = await Promise.all([
        battleDb.getField(dateStr, 10),
        profile ? battleDb.getMyClubs(profile.username) : []
      ]);
      setFieldData(field);
      setClubs(myClubs);
      if (myClubs.length > 0) {
        setActiveClub(myClubs[0]);
        const standings = await battleDb.getClubStandings(myClubs[0].id, dateStr);
        setClubStandings(prev => Object.assign({}, prev, { [myClubs[0].id]: standings }));
      }
    })();
  }, []);

  const loadClubStandings = async (club) => {
    setActiveClub(club);
    if (!clubStandings[club.id]) {
      const standings = await battleDb.getClubStandings(club.id, dateStr);
      setClubStandings(prev => Object.assign({}, prev, { [club.id]: standings }));
    }
  };

  const handleJoin = async () => {
    if (!clubCode.trim() || !profile) return;
    const res = await battleDb.joinClub({ code: clubCode.trim(), username: profile.username });
    if (res.ok) {
      setClubs(prev => [...prev, res.club]);
      setActiveClub(res.club);
      setShowJoin(false); setClubCode(""); setClubMsg("");
      const standings = await battleDb.getClubStandings(res.club.id, dateStr);
      setClubStandings(prev => Object.assign({}, prev, { [res.club.id]: standings }));
    } else {
      setClubMsg(res.message || "Something went wrong.");
    }
  };

  const handleCreate = async () => {
    if (!clubName.trim() || !profile) return;
    const res = await battleDb.createClub({ name: clubName.trim(), username: profile.username });
    if (res.ok) {
      setClubs(prev => [...prev, res.club]);
      setActiveClub(res.club);
      setShowCreate(false); setClubName(""); setClubMsg("");
      const standings = await battleDb.getClubStandings(res.club.id, dateStr);

      setClubMsg(res.message || "Something went wrong.");

            <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700}}>FRIEND BATTLE</div>
            <div className="gi-serif gi-gold" style={{fontSize:18,fontWeight:700}}>{dayLabel(dateStr)}</div>
          </div>
          <div style={{width:60}}/>
        </div>

        {/* Result hero */}
        <div className="gi-card" style={{padding:"22px 20px",textAlign:"center"}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:56,fontWeight:900,lineHeight:1}}>
            <span className="gi-gold">{result.correctCount}</span>
            <span style={{color:"rgba(200,168,75,.3)",fontSize:32}}>/7</span>
          </div>
          <div style={{fontSize:14,color:"rgba(200,180,140,.65)",letterSpacing:".06em",marginTop:4}}>

          </div>

                      {hasPlayed

                            {(row.adjusted_ms/1000).toFixed(1)}s
                          </div>
                        : <div style={{fontSize:11,color:"rgba(200,168,75,.3)"}}>not yet</div>

          )}

          {!showJoin && !showCreate && (
            <div style={{display:"flex",gap:8}}>
              <button className="gi-btn gi-btn-outline" style={{flex:1,fontSize:12,padding:"10px"}}
                onClick={() => { setShowJoin(true); setShowCreate(false); setClubMsg(""); }}>
                + JOIN A CLUB

              <button className="gi-btn gi-btn-outline" style={{flex:1,fontSize:12,padding:"10px"}}
                onClick={() => { setShowCreate(true); setShowJoin(false); setClubMsg(""); }}>
                + START A CLUB

          {showJoin && (
            <div className="gi-card" style={{padding:"16px"}}>
              <div style={{fontSize:12,color:"rgba(200,168,75,.6)",marginBottom:10,fontWeight:700,letterSpacing:".08em"}}>

              <input className="gi-input" placeholder="e.g. AUG247"
                value={clubCode} onChange={e => setClubCode(e.target.value.toUpperCase())}
                style={{letterSpacing:".2em",fontSize:18,textAlign:"center",marginBottom:10}}
                maxLength={6}/>
              {clubMsg && <div style={{fontSize:12,color:"#e08a8a",marginBottom:8}}>{clubMsg}</div>}
              <div style={{display:"flex",gap:8}}>
                <button className="gi-btn gi-btn-gold" style={{flex:1,padding:"11px"}} onClick={handleJoin}>JOIN</button>
                <button className="gi-btn gi-btn-ghost" onClick={() => { setShowJoin(false); setClubMsg(""); }}>Cancel</button>
              </div>
            </div>
          )}

          {showCreate && (
            <div className="gi-card" style={{padding:"16px"}}>
              <div style={{fontSize:12,color:"rgba(200,168,75,.6)",marginBottom:10,fontWeight:700,letterSpacing:".08em"}}>
                NAME YOUR CLUB
              </div>
              <input className="gi-input" placeholder="e.g. Saturday Boys"
                value={clubName} onChange={e => setClubName(e.target.value)}
                style={{marginBottom:10}} maxLength={32}/>
              {clubMsg && <div style={{fontSize:12,color:"#e08a8a",marginBottom:8}}>{clubMsg}</div>}
              <div style={{display:"flex",gap:8}}>
                <button className="gi-btn gi-btn-gold" style={{flex:1,padding:"11px"}} onClick={handleCreate}>CREATE</button>
                <button className="gi-btn gi-btn-ghost" onClick={() => { setShowCreate(false); setClubMsg(""); }}>Cancel</button>
              </div>
            </div>
          )}
        </div>

        <div style={{textAlign:"center",fontSize:11,color:"rgba(200,168,75,.35)",letterSpacing:".06em"}}>
          The Field resets at midnight ET. One Sprint per day.
        </div>
      </div>

      {/* Sticky footer */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,
        background:"linear-gradient(to top, rgba(7,13,31,1) 60%, rgba(7,13,31,0))",
        padding:"16px 20px 20px",display:"flex",gap:10,zIndex:10}}>
        <button className="gi-btn gi-btn-outline" style={{flex:1,maxWidth:160,padding:"13px",fontSize:13}}
          onClick={onBack}>← HOME</button>
        <button className="gi-btn gi-btn-gold" style={{flex:2,maxWidth:280,fontSize:15,padding:"14px"}}
          onClick={async () => {
            try { await navigator.clipboard.writeText(shareText); setCopied(true); setTimeout(()=>setCopied(false),2200); }
            catch(e) { alert(shareText); }
          }}>
          {copied ? "✓ COPIED!" : "📋 SHARE YOUR TIME"}
        </button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   FRIEND BATTLE HUB — entry point, shows today's status
   and routes to Sprint or result
═══════════════════════════════════════════════════════ */
function FriendBattleHub({ profile, logos, onBack }) {
  const [phase, setPhase]     = useState("loading"); // loading | ready | playing | done
  const [todayResult, setTodayResult] = useState(null);
  const [sprintResult, setSprintResult] = useState(null);
  const dateStr = getETDateString();

  useEffect(() => {
    (async () => {
      if (profile) {
        const existing = await battleDb.hasSprintedToday(profile.username, dateStr);
        if (existing) {
          setTodayResult(existing);
          setPhase("done");
        } else {
          setPhase("ready");
        }
      } else {
        setPhase("ready");
      }
    })();
  }, []);

  const handleComplete = async (result) => {
    setSprintResult(result);
    setPhase("done");
    if (profile) {
      await battleDb.logSprint({
        username: profile.username,
        dateStr: result.dateStr,
        totalMs: result.totalMs,
        penaltyMs: result.penaltyMs,
        correctCount: result.correctCount,
        courseIds: result.courseIds
      });
    }
  };

  if (phase === "loading") return (
    <div className="gi-app" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <div className="gi-stars"/>
      <div style={{fontSize:14,color:"rgba(200,168,75,.4)",letterSpacing:".2em"}}>LOADING…</div>
    </div>
  );

  if (phase === "h2h") return (
    <HeadToHeadHub profile={profile} logos={logos} onBack={() => setPhase("ready")}/>
  );

  if (phase === "club") return (
    <SprintResultScreen profile={profile} result={{
      answers:[], totalMs:0, penaltyMs:0, adjustedMs:0,
      correctCount:0, courseIds:[], dateStr
    }} logos={logos} onBack={() => setPhase("ready")} onPlayAgain={() => setPhase("playing")} clubOnly={true}/>
  );

  if (phase === "playing") return (
    <SprintScreen profile={profile} logos={logos}
      onComplete={handleComplete} onBack={() => setPhase("ready")}/>
  );

  if (phase === "done") {
    // Build a result object from stored data if coming back to a played day
    const resultToShow = sprintResult || (todayResult ? {
      correctCount: todayResult.correct_count,
      totalMs: todayResult.total_ms,
      penaltyMs: todayResult.penalty_ms,
      adjustedMs: todayResult.adjusted_ms,
      answers: [], // no detail available for already-played
      courseIds: [],
      dateStr
    } : null);
    if (!resultToShow) { setPhase("ready"); return null; }
    return (
      <SprintResultScreen profile={profile} result={resultToShow} logos={logos}
        onBack={onBack} onPlayAgain={() => setPhase("ready")}/>
    );
  }

  // ── READY — Pick Your Competition hub ──
  const courses = getSprintCourses(dateStr);
  return (
    <div className="gi-app" style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div className="gi-stars"/>
      <div className="gi-screen" style={{flex:1,display:"flex",flexDirection:"column",
        maxWidth:480,margin:"0 auto",width:"100%",padding:"24px 16px",gap:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← BACK</button>
        </div>

        <div style={{textAlign:"center",padding:"12px 0 4px"}}>
          <div style={{fontSize:38,marginBottom:6}}>⚡</div>
          <div className="gi-serif gi-gold" style={{fontSize:32,fontWeight:900,lineHeight:1.05}}>Friend Battle</div>
          <div style={{color:"rgba(200,180,140,.45)",fontSize:13,marginTop:6,letterSpacing:".08em"}}>
            PICK YOUR COMPETITION
          </div>
        </div>

        {/* Head-to-Head */}
        <div className="gi-card" style={{padding:"20px",cursor:"pointer",
          border:"1.5px solid rgba(200,168,75,.35)",transition:"all .2s"}}
          onClick={() => setPhase("h2h")}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontSize:32,flexShrink:0}}>🤺</div>
            <div style={{flex:1}}>
              <div style={{fontSize:17,fontWeight:700,color:"#f0dfa0",marginBottom:3}}>Head-to-Head</div>
              <div style={{fontSize:12,color:"rgba(200,180,140,.65)",lineHeight:1.45}}>
                Play 5 courses. Send the link. They play the same 5.<br/>
                Score stays hidden until they finish.
              </div>
            </div>
            <div style={{fontSize:18,color:"rgba(200,168,75,.4)"}}>→</div>
          </div>
        </div>

        {/* Sprint / The Field */}
        <div className="gi-card" style={{padding:"20px",cursor:"pointer",
          border:"1.5px solid rgba(200,168,75,.35)",transition:"all .2s",
          opacity: todayResult ? 0.65 : 1}}
          onClick={() => !todayResult && setPhase("playing")}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontSize:32,flexShrink:0}}>⚡</div>
            <div style={{flex:1}}>
              <div style={{fontSize:17,fontWeight:700,color:"#f0dfa0",marginBottom:3}}>
                The Sprint {todayResult ? "✓" : ""}
              </div>
              <div style={{fontSize:12,color:"rgba(200,180,140,.65)",lineHeight:1.45}}>
                {todayResult
                  ? `Done — you posted ${(todayResult.adjusted_ms/1000).toFixed(1)}s today.`
                  : "7 courses. Wrong answers add 10 seconds. Compete against The Field."}
              </div>
            </div>
            <div style={{fontSize:18,color:"rgba(200,168,75,.4)"}}>→</div>
          </div>
          <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
            {courses.slice(0,7).map(c => (
              <div key={c.id} style={{width:32,height:32,borderRadius:"50%",
                border:"1px solid rgba(200,168,75,.25)",overflow:"hidden",
                background:"white",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <CourseLogo course={c} size={32} uploadedData={logos && logos[c.id]}/>
              </div>
            ))}
          </div>
        </div>

        {/* Club */}
        <div className="gi-card" style={{padding:"20px",cursor:"pointer",
          border:"1.5px solid rgba(200,168,75,.35)",transition:"all .2s"}}
          onClick={() => setPhase("club")}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontSize:32,flexShrink:0}}>🏌️</div>
            <div style={{flex:1}}>
              <div style={{fontSize:17,fontWeight:700,color:"#f0dfa0",marginBottom:3}}>Your Club</div>
              <div style={{fontSize:12,color:"rgba(200,180,140,.65)",lineHeight:1.45}}>
                Persistent group rivalry. Sprint standings for your crew.<br/>
                Share a Club Code to invite anyone.
              </div>
            </div>
            <div style={{fontSize:18,color:"rgba(200,168,75,.4)"}}>→</div>
          </div>
        </div>

        <div style={{textAlign:"center",fontSize:11,color:"rgba(200,168,75,.3)",letterSpacing:".06em"}}>
          Sprint resets at midnight ET · Head-to-Head anytime
        </div>
      </div>
    </div>
  );
}


/* ═══════════════════════════════════════════════════════
   HEAD-TO-HEAD CHALLENGE GAME — 5 courses, seeded
   Used by both challenger (new seed) and opponent (from link)
═══════════════════════════════════════════════════════ */
function ChallengeGameScreen({ profile, logos, seed, isOpponent, challengerData, onComplete, onBack }) {
  const courses  = getChallengeCourses(seed);
  const label    = challengeLabel(seed);
  const dateStr  = getETDateString();

  const [qIdx, setQIdx]         = useState(0);
  const [answers, setAnswers]   = useState([]);
  const [phase, setPhase]       = useState("idle");
  const [selectedOpt, setSel]   = useState(null);
  const [elapsed, setElapsed]   = useState(0);
  const [totalMs, setTotalMs]   = useState(0);
  const qStart  = useRef(Date.now());
  const timerRef = useRef(null);

  const q = courses[qIdx];
  const optsData = React.useMemo(() => {
    if (!q) return null;
    return getDailyOptions(q, seed + "-h2h-" + qIdx);
  }, [qIdx]);

  useEffect(() => {
    qStart.current = Date.now();
    setElapsed(0);
    timerRef.current = setInterval(() => setElapsed(Date.now() - qStart.current), 87);
    return () => clearInterval(timerRef.current);
  }, [qIdx]);

  const choose = (optIdx) => {
    if (phase !== "idle" || !optsData) return;
    clearInterval(timerRef.current);
    const t = Date.now() - qStart.current;
    const correct = optIdx === optsData.ansIdx;
    setSel(optIdx);
    setPhase("sel");
    correct ? playClick() : playWrong();

    setTimeout(() => {
      const newAnswers = [...answers, { correct, picked: optIdx, timeMs: t, course: q, optsData }];
      const newTotal = totalMs + t;
      setAnswers(newAnswers);
      setTotalMs(newTotal);

      if (qIdx < courses.length - 1) {
        setQIdx(i => i + 1);
        setSel(null);
        setPhase("idle");
      } else {
        const correctCount = newAnswers.filter(a => a.correct).length;
        onComplete({ answers: newAnswers, totalMs: newTotal, correctCount, seed, courses, isOpponent, challengerData });
      }
    }, 350);
  };

  const optState = (i) => {
    if (phase === "idle") return "idle";
    if (phase === "sel")  return i === selectedOpt ? "sel" : "idle";
    return "idle";
  };

  const isOver6s = elapsed > 6000;

  return (
    <div className="gi-app" style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div className="gi-stars"/>
      <div className="gi-screen" style={{flex:1,display:"flex",flexDirection:"column",
        maxWidth:520,margin:"0 auto",width:"100%",padding:"18px 16px",gap:14}}>

        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← BACK</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700}}>
              HEAD-TO-HEAD
            </div>
            <div style={{fontSize:12,color:"rgba(200,168,75,.4)"}}>
              {isOpponent ? "vs @" + (challengerData && challengerData.challenger_display) : label}
            </div>
          </div>
          <div className={`gi-timer ${isOver6s ? "gi-timer-fast" : ""}`} style={{fontSize:20}}>
            {fmtFull(elapsed)}
          </div>
        </div>

        {/* Progress dots */}
        <div style={{display:"flex",gap:6,justifyContent:"center"}}>
          {courses.map((_, i) => (
            <div key={i} className={`gi-dot ${
              i < qIdx ? (answers[i] && answers[i].correct ? "gi-dot-correct" : "gi-dot-wrong")
              : i === qIdx ? "gi-dot-active" : ""
            }`}/>
          ))}
        </div>

        {/* Logo */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",
          padding:"16px 0",position:"relative",flex:1,justifyContent:"center"}}>
          <div className="gi-spotlight" style={{width:260,height:260}}/>
          <div className="gi-logo-ring" style={{width:156,height:156,position:"relative",zIndex:1}}>
            <CourseLogo course={q} size={156} uploadedData={logos && logos[q.id]}/>
          </div>
          <div style={{marginTop:14,textAlign:"center",position:"relative",zIndex:1}}>
            <div style={{fontSize:11,color:"rgba(200,168,75,.35)",letterSpacing:".06em"}}>
              {qIdx + 1} OF 5 · NO DO-OVERS
            </div>
          </div>
        </div>

        {/* Options */}
        {optsData && (
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {optsData.opts.map((opt, i) => (
              <OptBtn key={opt.id} letter={"ABCD"[i]} option={opt}
                state={optState(i)} onClick={() => choose(i)} disabled={phase !== "idle"}/>
            ))}
          </div>
        )}

        <div style={{textAlign:"center",fontSize:12,color:"rgba(200,168,75,.3)",letterSpacing:".08em"}}>
          ⏱ TOTAL: {fmtFull(totalMs + elapsed)}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   CHALLENGE RESULT SCREEN — reveal + share
═══════════════════════════════════════════════════════ */
function ChallengeResultScreen({ profile, result, logos, onBack, onRematch }) {
  const [copied, setCopied] = useState(false);
  const [saving, setSaving] = useState(true);

  const { answers, totalMs, correctCount, seed, courses, isOpponent, challengerData } = result;
  const label = challengeLabel(seed);

  // Hole-by-hole match play result (opponent vs challenger)
  // For challenger: we don't have opponent data yet — show pending
  // For opponent: we have both sets, show full result
  const myCorrect    = correctCount;
  const myTime       = totalMs;
  const theirCorrect = isOpponent ? (challengerData && challengerData.challenger_correct) : null;
  const theirTime    = isOpponent ? (challengerData && challengerData.challenger_time_ms) : null;
  const theirName    = isOpponent
    ? (challengerData && challengerData.challenger_display)
    : null;

  // Match play: count holes won by each side
  let myHoles = 0, theirHoles = 0;
  if (isOpponent && answers.length === 5) {
    answers.forEach((a, i) => {
      // We don't have hole-by-hole challenger data — use overall correct/time
      // Simplified: correct = win hole, wrong = lose hole, both wrong = halve
      // Full hole-by-hole would require storing per-hole challenger data (future)
      if (a.correct) myHoles++;
    });
    // challenger holes won = their correct count
    theirHoles = theirCorrect || 0;
    // Adjust for shared wrong answers (halved holes) — simplified
    const shared = Math.min(myHoles, theirHoles);
    // Net: just use correct counts as proxy for now
  }

  const matchResult = isOpponent && theirCorrect !== null ? (() => {
    if (myCorrect > theirCorrect) return { winner: "you", margin: myCorrect - theirCorrect };
    if (theirCorrect > myCorrect) return { winner: "them", margin: theirCorrect - myCorrect };
    // Tied on correct — time decides
    if (myTime < theirTime) return { winner: "you", margin: 0, tiebreak: true };
    if (theirTime < myTime) return { winner: "them", margin: 0, tiebreak: true };
    return { winner: "tie" };
  })() : null;

  // Save result on mount
  useEffect(() => {
    (async () => {
      if (!profile) { setSaving(false); return; }
      if (isOpponent) {
        await challengeDb.completeChallenge({
          seed, username: profile.username,
          correctCount, timeMs: totalMs
        });
      } else {
        await challengeDb.createChallenge({
          seed, username: profile.username,
          correctCount, timeMs: totalMs,
          courseIds: courses.map(c => c.id)
        });
      }
      setSaving(false);
    })();
  }, []);

  // Share strings
  const challengeUrl = "https://golf-iq.app?c=" + seed;
  const myTimeSec = (totalMs / 1000).toFixed(1);

  const challengerShareText = saving ? "" :
    `Golf IQ Head-to-Head ⚡ Challenge #${label}
` +
    `I scored ${correctCount}/5 in ${myTimeSec}s

` +
    `Can you beat me? Your turn →
${challengeUrl}`;

  const opponentShareText = !matchResult ? "" : matchResult.winner === "you"
    ? `Golf IQ Head-to-Head ⚡
I beat @${theirName} ${correctCount}-${theirCorrect}${matchResult.tiebreak ? " on time" : ""}
Challenge #${label}
https://golf-iq.app`
    : matchResult.winner === "them"
    ? `Golf IQ Head-to-Head ⚡
@${theirName} beat me ${theirCorrect}-${myCorrect}${matchResult.tiebreak ? " on time" : ""} — rematch coming
Challenge #${label}
https://golf-iq.app`
    : `Golf IQ Head-to-Head ⚡
All square with @${theirName} — ${myCorrect}/5 each
Challenge #${label}
https://golf-iq.app`;

  const shareText = isOpponent ? opponentShareText : challengerShareText;

  const resultHeadline = () => {
    if (!isOpponent) return saving ? "Saving…" : "Challenge sent!";
    if (!matchResult) return "Result pending";
    if (matchResult.winner === "you") return matchResult.tiebreak ? "⚡ You win on time!" : `🏆 You win ${myCorrect}-${theirCorrect}`;
    if (matchResult.winner === "them") return matchResult.tiebreak ? "💨 Lost on time" : `💨 Beaten ${theirCorrect}-${myCorrect}`;
    return "🤝 All Square";
  };

  return (
    <div className="gi-app" style={{minHeight:"100vh",paddingBottom:90}}>
      <div className="gi-stars"/>
      <div className="gi-screen" style={{maxWidth:480,margin:"0 auto",padding:"20px 16px",
        display:"flex",flexDirection:"column",gap:16}}>

        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← HOME</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700}}>
              HEAD-TO-HEAD
            </div>
            <div style={{fontSize:13,color:"rgba(200,168,75,.6)"}}>{label}</div>
          </div>
          <div style={{width:60}}/>
        </div>

        {/* Result hero */}
        <div className="gi-card" style={{padding:"24px 20px",textAlign:"center"}}>
          <div style={{fontSize:22,fontWeight:700,color:"#f0dfa0",fontFamily:"'Playfair Display',serif",
            marginBottom:6}}>{resultHeadline()}</div>

          {/* Score comparison */}
          {isOpponent && matchResult ? (
            <div style={{display:"flex",alignItems:"center",gap:0,justifyContent:"center",
              marginTop:14,paddingTop:14,borderTop:"1px solid rgba(200,168,75,.15)"}}>
              <div style={{flex:1,textAlign:"center"}}>
                <div style={{fontSize:11,color:"rgba(200,168,75,.4)",letterSpacing:".1em",marginBottom:4}}>YOU</div>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:42,fontWeight:900,
                  color: matchResult.winner==="you"?"#f0dfa0":"rgba(200,168,75,.5)"}}>
                  {myCorrect}
                </div>
                <div style={{fontSize:12,color:"rgba(200,168,75,.5)",marginTop:2}}>{myTimeSec}s</div>
              </div>
              <div style={{fontSize:22,color:"rgba(200,168,75,.3)",padding:"0 8px"}}>vs</div>
              <div style={{flex:1,textAlign:"center"}}>
                <div style={{fontSize:11,color:"rgba(200,168,75,.4)",letterSpacing:".1em",marginBottom:4}}>
                  @{theirName}
                </div>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:42,fontWeight:900,
                  color: matchResult.winner==="them"?"#f0dfa0":"rgba(200,168,75,.5)"}}>
                  {theirCorrect}
                </div>
                <div style={{fontSize:12,color:"rgba(200,168,75,.5)",marginTop:2}}>
                  {((theirTime||0)/1000).toFixed(1)}s
                </div>
              </div>
            </div>
          ) : (
            <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(200,168,75,.15)"}}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:48,fontWeight:900}}>
                <span className="gi-gold">{correctCount}</span>
                <span style={{color:"rgba(200,168,75,.3)",fontSize:28}}>/5</span>
              </div>
              <div style={{fontSize:13,color:"rgba(200,180,140,.6)",marginTop:4}}>{myTimeSec}s</div>
              {!isOpponent && !saving && (
                <div style={{marginTop:14,padding:"12px 16px",background:"rgba(200,168,75,.08)",
                  borderRadius:8,fontSize:13,color:"rgba(200,180,140,.75)",lineHeight:1.5}}>
                  Share the link below with your opponent.<br/>
                  They'll play the same 5 courses and see your score after.
                </div>
              )}
            </div>
          )}
        </div>

        {/* Scorecard */}
        {answers && answers.length > 0 && (
          <div className="gi-card" style={{padding:"14px"}}>
            <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",
              fontWeight:700,marginBottom:10}}>YOUR SCORECARD</div>
            {answers.map((a, i) => (
              <div key={i} className={`gi-result-row ${a.correct ? "gi-result-correct" : "gi-result-wrong"}`}
                style={{marginBottom: i < answers.length - 1 ? 7 : 0}}>
                <div style={{width:28,height:28,borderRadius:"50%",flexShrink:0,fontSize:16,
                  background:a.correct?"rgba(40,200,90,.15)":"rgba(200,40,40,.15)",
                  border:"1.5px solid "+(a.correct?"rgba(40,200,90,.4)":"rgba(200,40,40,.4)"),
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {a.course.sym}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {a.course.name}
                  </div>
                  {!a.correct && a.optsData && (
                    <div style={{fontSize:11,color:"rgba(255,140,140,.6)",marginTop:1}}>
                      You picked: {a.optsData.opts[a.picked] && a.optsData.opts[a.picked].name}
                    </div>
                  )}
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:12,color:"rgba(200,168,75,.55)"}}>{fmtFull(a.timeMs)}</div>
                  <div style={{fontSize:15}}>{a.correct ? "✅" : "❌"}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {onRematch && isOpponent && (
          <button className="gi-btn gi-btn-outline" style={{width:"100%",padding:"12px",fontSize:14}}
            onClick={onRematch}>
            ⚡ SEND A REMATCH
          </button>
        )}

        <div style={{textAlign:"center",fontSize:11,color:"rgba(200,168,75,.35)",letterSpacing:".06em"}}>
          {label}
        </div>
      </div>

      {/* Sticky footer */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,
        background:"linear-gradient(to top, rgba(7,13,31,1) 60%, rgba(7,13,31,0))",
        padding:"16px 20px 20px",display:"flex",gap:10,zIndex:10}}>
        <button className="gi-btn gi-btn-outline" style={{flex:1,maxWidth:160,padding:"13px",fontSize:13}}
          onClick={onBack}>← HOME</button>
        <button className="gi-btn gi-btn-gold"
          style={{flex:2,maxWidth:280,fontSize:14,padding:"14px",
            opacity: saving || !shareText ? 0.5 : 1}}
          disabled={saving || !shareText}
          onClick={async () => {
            try { await navigator.clipboard.writeText(shareText); setCopied(true); setTimeout(()=>setCopied(false),2200); }
            catch(e) { alert(shareText); }
          }}>
          {saving ? "Saving…" : copied ? "✓ COPIED!" : isOpponent ? "📋 SHARE RESULT" : "📋 COPY CHALLENGE LINK"}
        </button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   HEAD-TO-HEAD HUB — entry point for 1v1 challenge
═══════════════════════════════════════════════════════ */
function HeadToHeadHub({ profile, logos, incomingSeed, onBack }) {
  const [phase, setPhase]   = useState(incomingSeed ? "opponent-ready" : "ready");
  const [seed, setSeed]     = useState(incomingSeed || newChallengeSeed());
  const [result, setResult] = useState(null);
  const [challengerData, setChallengerData] = useState(null);
  const [loading, setLoading] = useState(!!incomingSeed);

  useEffect(() => {
    if (!incomingSeed) return;
    (async () => {
      const ch = await challengeDb.getChallenge(incomingSeed);
      if (ch) { setChallengerData(ch); setLoading(false); setPhase("opponent-ready"); }
      else { setLoading(false); setPhase("invalid"); }
    })();
  }, [incomingSeed]);

  const handleComplete = (res) => {

function GameScreen({ game, profile, logos, onComplete }) {
  const [qIdx, setQIdx]       = useState(0);
  const [results, setResults] = useState([]);
  const [times, setTimes]     = useState([]);
  const [picked, setPicked]   = useState([]); // index chosen per Q
  const [phase, setPhase]     = useState("idle"); // idle | sel | done
  const [selectedOpt, setSel] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const qStart                = useRef(Date.now());
  const timerRef              = useRef(null);

  const q = game[qIdx];
  const totalElapsed = times.reduce((a,b)=>a+b,0) + elapsed;

  // Per-question timer
  useEffect(() => {
    qStart.current = Date.now();
    setElapsed(0);
    timerRef.current = setInterval(() => setElapsed(Date.now() - qStart.current), 87);
    return () => clearInterval(timerRef.current);
  }, [qIdx]);

  const choose = (optIdx) => {
    if (phase !== "idle") return;
    clearInterval(timerRef.current);
    const t = Date.now() - qStart.current;
    const correct = optIdx === q.ansIdx;
    setSel(optIdx);
    setPhase("sel");
    playClick();

    setTimeout(() => {
      setPhase("done");
      correct ? playCupIn() : playWrong();

      const newResults = [...results, correct];
      const newTimes   = [...times, t];
      const newPicked  = [...picked, optIdx];
      setResults(newResults); setTimes(newTimes); setPicked(newPicked);

      if (qIdx < 4) {
        setTimeout(() => {
          setQIdx(i => i+1);
          setSel(null); setPhase("idle");
        }, 1400);
      } else {
        setTimeout(() => onComplete({ results:newResults, times:newTimes, picked:newPicked }), 1600);
      }
    }, 480);
  };

  const optState = (i) => {
    if (phase === "idle") return "idle";
    if (phase === "sel")  return i === selectedOpt ? "sel" : "idle";
    if (i === q.ansIdx)   return "ok";
    if (i === selectedOpt) return "bad";
    return "idle";
  };

  const isOver6s = elapsed > 6000;

  return (
    <div className="gi-app" style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div className="gi-stars"/>
      <div className="gi-screen" style={{flex:1,display:"flex",flexDirection:"column",maxWidth:520,margin:"0 auto",width:"100%",padding:"18px 16px",gap:14}}>

        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {Array.from({length:5},(_,i)=>(
              <div key={i} className={`gi-dot ${i<qIdx?(results[i]?"gi-dot-correct":"gi-dot-wrong"):i===qIdx?"gi-dot-active":""}`}/>
            ))}
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
            <div className={`gi-timer ${isOver6s?"gi-timer-fast":""}`}>{fmtFull(elapsed)}</div>
            <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".1em"}}>THIS HOLE</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontWeight:700,color:"rgba(200,168,75,.8)",fontSize:18}}>
              {results.filter(Boolean).length}/{qIdx}
            </div>
            <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".08em"}}>SCORE</div>
          </div>
        </div>

        <div className="gi-progress-wrap"><div className="gi-progress-fill" style={{width:`${(qIdx/5)*100}%`}}/></div>

        {/* Logo spotlight */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"12px 0",position:"relative"}}>
          <div className="gi-spotlight" style={{width:240,height:240}}/>
          <div className="gi-logo-ring" style={{width:144,height:144,position:"relative",zIndex:1}}>
            <CourseLogo course={q.correct} size={144} allowSuggest={true} uploadedData={logos && logos[q.correct.id]}/>
          </div>
          <div style={{marginTop:14,textAlign:"center",position:"relative",zIndex:1}}>
            <div style={{fontSize:12,color:"rgba(200,168,75,.5)",letterSpacing:".14em",marginBottom:4}}>
              HOLE {qIdx+1} OF 5
            </div>
            <div style={{fontSize:11,color:"rgba(200,180,140,.4)",letterSpacing:".06em"}}>
              {q.correct.logoUrl ? "Which course does this logo belong to?" : "Which course does this emblem represent?"}
            </div>
            {!q.correct.logoUrl && (
              <div style={{fontSize:9,color:"rgba(200,168,75,.25)",marginTop:4,letterSpacing:".04em"}}>
                Have the real logo? Tap 📷 to upload it
              </div>
            )}
          </div>
        </div>

        {/* Options */}
        <div style={{display:"flex",flexDirection:"column",gap:9,flex:1}}>
          {q.opts.map((opt, i) => (
            <OptBtn key={opt.id} letter={"ABCD"[i]} option={opt}
              state={optState(i)} onClick={()=>choose(i)} disabled={phase!=="idle"}/>
          ))}
        </div>

        {/* Total time */}
        <div style={{textAlign:"center",fontSize:12,color:"rgba(200,168,75,.3)",letterSpacing:".08em"}}>
          ⏱ TOTAL: {fmtFull(totalElapsed)}
        </div>
      </div>
    </div>
  );
}

function ResultsScreen({ game, results, times, picked, profile, stats, newTrophies, onPlayAgain, onHome }) {
  const score = results.filter(Boolean).length;
  const total = times.reduce((a,b)=>a+b,0);
  const [copied, setCopied] = useState(false);
  const [toastTrophy, setToastTrophy] = useState(null);
  const toastIdx = useRef(0);

  useEffect(() => {
    if (!newTrophies.length) return;
    let i = 0;
    const show = () => {
      if (i < newTrophies.length) { setToastTrophy(newTrophies[i]); i++; setTimeout(show, 4000); }
    };
    const t = setTimeout(show, 800);
    return () => clearTimeout(t);
  }, []);

  const shareText = generateShare(game, results, times, profile, stats);

  const copy = async () => {
    try { await navigator.clipboard.writeText(shareText); setCopied(true); setTimeout(()=>setCopied(false), 2200); }

/* ═══════════════════════════════════════════════════════
   ADMIN SCREEN — Logo Manager
═══════════════════════════════════════════════════════ */
function AdminLogoCard({ course, uploadedData, onSave, onRemove }) {
  const [dragging, setDragging] = useState(false);
  const [saving, setSaving]     = useState(false);
  const [flash, setFlash]       = useState(false);
  const [imgErr, setImgErr]     = useState(false);
  const fileRef                 = useRef(null);
  const dragCount               = useRef(0);

  const status = uploadedData ? "up" : course.logoUrl ? "bi" : "mi";
  const displayUrl = uploadedData || (course.logoUrl && !imgErr ? course.logoUrl : null);
  const borderColor = flash ? "#4caf7d" : dragging ? "#c8a84b" : status === "up" ? "rgba(76,175,80,.5)" : "rgba(255,255,255,.1)";

  const readAndSave = function(file) {
    if (!file) return;
    setSaving(true);
    var reader = new FileReader();
    reader.onload = function(e) {
      onSave(course.id, e.target.result);
      setSaving(false);
      setFlash(true);
      setTimeout(function(){ setFlash(false); }, 1500);
    };
    reader.onerror = function() {
      setSaving(false);
      alert("Could not read file.");
    };
    reader.readAsDataURL(file);
  };

  const handleDrop = function(e) {
    e.preventDefault();
    dragCount.current = 0;
    setDragging(false);
    var files = e.dataTransfer.files;
    if (files && files.length > 0) { readAndSave(files[0]); return; }
    var items = e.dataTransfer.items;
    if (items && items.length > 0 && items[0].kind === "file") { readAndSave(items[0].getAsFile()); }
  };

  const doSave = function() {};

  return (
    <div
      onDrop={handleDrop}
      onDragEnter={function(e){ e.preventDefault(); dragCount.current++; setDragging(true); }}
      onDragOver={function(e){ e.preventDefault(); }}
      onDragLeave={function(e){ e.preventDefault(); dragCount.current--; if(dragCount.current<=0){dragCount.current=0;setDragging(false);} }}
      style={{background:"#0d1520",border:"2px solid "+borderColor,borderRadius:12,padding:"12px 10px",
        display:"flex",flexDirection:"column",alignItems:"center",gap:7,position:"relative",
        boxShadow:flash?"0 0 14px rgba(76,175,80,.4)":dragging?"0 0 14px rgba(200,168,75,.3)":"none",
        transition:"border-color .2s,box-shadow .2s"}}>

      <div style={{position:"absolute",top:5,left:7,fontSize:9,color:"rgba(200,168,75,.3)",fontFamily:"monospace"}}>#{course.rank}</div>
      <div style={{position:"absolute",top:7,right:7,width:7,height:7,borderRadius:"50%",
        background:status==="up"?"#4caf7d":status==="bi"?"#c8a84b":"#333"}} />

      <div onClick={function(){ fileRef.current && fileRef.current.click(); }}
        style={{width:76,height:76,borderRadius:"50%",cursor:"pointer",overflow:"hidden",flexShrink:0,
          background:displayUrl?"white":"rgba(255,255,255,.04)",
          border:"1px dashed "+(dragging?"rgba(200,168,75,.7)":"rgba(255,255,255,.1)"),
          display:"flex",alignItems:"center",justifyContent:"center"}}>
        {displayUrl
            ? <img src={displayUrl} alt="" style={{width:"100%",height:"100%",objectFit:"contain",padding:4}} onError={function(){setImgErr(true);}}/>
            : <div style={{textAlign:"center",pointerEvents:"none"}}>
                <div style={{fontSize:24}}>{course.sym}</div>
                <div style={{fontSize:7,color:"rgba(200,168,75,.3)"}}>DROP</div>
              </div>
        }
      </div>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}}
        onChange={function(e){ readAndSave(e.target.files && e.target.files[0]); }} />

      <div style={{fontSize:11,fontWeight:700,color:"#e8d5a0",textAlign:"center",lineHeight:1.3,wordBreak:"break-word"}}>{course.name}</div>
      <div style={{fontSize:9,color:"rgba(200,168,75,.33)",textAlign:"center"}}>{course.loc}</div>

      {saving ? (
        <div style={{fontSize:10,color:"rgba(200,168,75,.6)"}}>Saving…</div>
      ) : flash ? (
        <div style={{fontSize:10,color:"rgba(76,175,80,.9)",fontWeight:700}}>✓ Saved!</div>
      ) : uploadedData ? (
        <button onClick={function(){ onRemove(course.id); }}
          style={{width:"100%",background:"rgba(255,60,60,.07)",border:"1px solid rgba(255,60,60,.2)",
            borderRadius:6,color:"rgba(255,100,100,.4)",padding:"4px 0",cursor:"pointer",fontSize:9}}>Remove</button>
      ) : (
        <div style={{fontSize:9,color:"rgba(255,255,255,.12)",textAlign:"center"}}>
          {status==="bi" ? "⚠ URL" : "drop to add"}
        </div>
      )}
    </div>
  );
}

function AdminScreen({ logos={}, onSaveLogo, onRemoveLogo, onBack }) {
  const [filter, setFilter]     = useState("all");
  const [search, setSearch]     = useState("");
  const [sortBy, setSortBy]     = useState("alpha");
  const [toast, setToast]       = useState(null);
  const [importText, setImportText] = useState("");
  const [showImport, setShowImport] = useState(false);

  const handleSave = function(id, dataUrl) {
    onSaveLogo(id, dataUrl);
    var c = ALL_COURSES.find(function(c){ return c.id===id; });
    setToast("✓ " + (c ? c.name : id) + " saved");
    setTimeout(function(){ setToast(null); }, 2000);
  };

  const handleRemove = function(id) { onRemoveLogo(id); };

  const handleExport = async function() {
    var result = await db.loadAll();
    var json = JSON.stringify(result);
    var a = document.createElement("a");
    a.href = "data:application/octet-stream," + encodeURIComponent(json);
    a.download = "golf-iq-logos.json";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 100);
    setToast("✓ Exported " + Object.keys(result).length + " logos");
    setTimeout(function(){ setToast(null); }, 3000);
  };

  const handleImport = function() {
    try {
      var data = JSON.parse(importText);
      var ids = Object.keys(data);
      ids.forEach(function(id) {
        var val = data[id];
        if (typeof val === "string" && val.indexOf("data:") === 0) {
          onSaveLogo(id, val);
        }
      });
      setShowImport(false);
      setImportText("");
      setToast("✓ Imported " + ids.length + " logos");
      setTimeout(function(){ setToast(null); }, 3000);
    } catch(err) {
      alert("Import failed — paste the full exported text.");
    }
  };

  var uploadCount  = Object.keys(logos).length;
  var builtinCount = ALL_COURSES.filter(function(c){ return c.logoUrl && !logos[c.id]; }).length;
  var missingCount = ALL_COURSES.filter(function(c){ return !c.logoUrl && !logos[c.id]; }).length;

  var sorted = ALL_COURSES.map(function(c,i){ return Object.assign({},c,{rank:i+1}); });
  if (sortBy === "alpha") {
    sorted = sorted.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  }
  var visible = sorted.filter(function(c) {
    var st = logos[c.id] ? "up" : c.logoUrl ? "bi" : "mi";
    if (filter === "uploaded" && st !== "up") return false;
    if (filter === "builtin"  && st !== "bi") return false;
    if (filter === "missing"  && st !== "mi") return false;
    if (search) {
      var q = search.toLowerCase();
      return c.name.toLowerCase().indexOf(q) >= 0 || c.loc.toLowerCase().indexOf(q) >= 0;
    }
    return true;
  });

  var filterBtns = [
    {label:"All",       key:"all",      count:100},
    {label:"Uploaded",  key:"uploaded", count:uploadCount},
    {label:"URL",       key:"builtin",  count:builtinCount},
    {label:"Missing",   key:"missing",  count:missingCount},
  ];


  return (
    <div className="gi-app" style={{minHeight:"100vh"}}>
      <div className="gi-stars"/>
      <div style={{maxWidth:900,margin:"0 auto",padding:"20px 16px",position:"relative",zIndex:1}}>

        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
          <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← Back</button>
          <div style={{flex:1}}>
            <div className="gi-serif gi-gold" style={{fontSize:22,fontWeight:700}}>Logo Manager</div>
            <div style={{fontSize:11,color:"rgba(200,168,75,.4)"}}>{uploadCount} uploaded · drag images onto cards</div>
          </div>
          <button onClick={handleExport}
            style={{padding:"7px 14px",borderRadius:8,fontSize:12,cursor:"pointer",fontWeight:700,
              background:"rgba(76,175,80,.15)",border:"1px solid rgba(76,175,80,.4)",color:"rgba(76,175,80,.9)"}}>
            ⬇ Export
          </button>
          <button onClick={function(){ setShowImport(function(v){return !v;}); }}
            style={{padding:"7px 14px",borderRadius:8,fontSize:12,cursor:"pointer",fontWeight:700,
              background:"rgba(200,168,75,.15)",border:"1px solid rgba(200,168,75,.4)",color:"rgba(200,168,75,.9)"}}>
            ⬆ Import
          </button>
        </div>

        {showImport && (
          <div style={{marginBottom:12,background:"rgba(0,0,0,.5)",borderRadius:8,padding:12}}>
            <div style={{fontSize:11,color:"rgba(200,168,75,.7)",marginBottom:6}}>
              Paste your previously exported text here:
            </div>
            <textarea value={importText}
              onChange={function(e){ setImportText(e.target.value); }}
              placeholder="Paste exported logo data here..."
              style={{width:"100%",height:72,background:"rgba(0,0,0,.4)",border:"1px solid rgba(200,168,75,.3)",
                borderRadius:6,color:"rgba(200,168,75,.8)",fontSize:10,padding:8,
                boxSizing:"border-box",resize:"none",display:"block"}}/>
            <div style={{display:"flex",gap:8,marginTop:6}}>
              <button onClick={handleImport}
                style={{padding:"5px 14px",fontSize:11,cursor:"pointer",fontWeight:700,
                  background:"rgba(200,168,75,.2)",border:"1px solid rgba(200,168,75,.5)",
                  borderRadius:6,color:"rgba(200,168,75,.9)"}}>✓ Import</button>
              <button onClick={function(){ setShowImport(false); setImportText(""); }}
                style={{padding:"5px 10px",fontSize:11,cursor:"pointer",
                  background:"transparent",border:"1px solid rgba(255,255,255,.2)",
                  borderRadius:6,color:"rgba(255,255,255,.4)"}}>Cancel</button>
            </div>
          </div>
        )}

        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
          {filterBtns.map(function(f){
            return (
              <button key={f.key} onClick={function(){ setFilter(f.key); }}
                style={{padding:"6px 12px",borderRadius:20,fontSize:12,cursor:"pointer",fontWeight:700,
                  background:filter===f.key?"rgba(200,168,75,.25)":"rgba(255,255,255,.06)",
                  border:"1px solid "+(filter===f.key?"rgba(200,168,75,.6)":"rgba(255,255,255,.1)"),
                  color:filter===f.key?"#c8a84b":"rgba(255,255,255,.4)"}}>
                {f.label} ({f.count})
              </button>
            );
          })}
          <input value={search} onChange={function(e){ setSearch(e.target.value); }}
            placeholder="Search…"
            style={{flex:1,minWidth:100,background:"rgba(255,255,255,.05)",
              border:"1px solid rgba(200,168,75,.2)",borderRadius:20,color:"#e8d5a0",
              padding:"6px 14px",fontSize:12,outline:"none"}}/>
          {[{key:"rank",label:"# Rank"},{key:"alpha",label:"A–Z"}].map(function(s){
            return (
              <button key={s.key} onClick={function(){ setSortBy(s.key); }}
                style={{padding:"6px 12px",borderRadius:20,fontSize:12,cursor:"pointer",fontWeight:700,
                  background:sortBy===s.key?"rgba(200,168,75,.2)":"rgba(255,255,255,.04)",
                  border:"1px solid "+(sortBy===s.key?"rgba(200,168,75,.5)":"rgba(255,255,255,.1)"),
                  color:sortBy===s.key?"#c8a84b":"rgba(255,255,255,.3)"}}>
                {s.label}
              </button>
            );
          })}
          <span style={{fontSize:11,color:"rgba(200,168,75,.35)"}}>{visible.length} shown</span>

// Returns "YYYY-MM-DD" in ET timezone (puzzle reveal is midnight ET)
function getETDateString(d) {
  d = d || new Date();
  // ET is UTC-5 (EST) or UTC-4 (EDT). Use Intl for accuracy across DST.
  const fmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York",
    year: "numeric", month: "2-digit", day: "2-digit"
  });
  return fmt.format(d);  // returns "YYYY-MM-DD"
}

// Days since DAILY_EPOCH, in ET. Day 1 = epoch day itself.
function getDayNumber(dateStr) {
  dateStr = dateStr || getETDateString();
  const epoch = new Date(DAILY_EPOCH + "T12:00:00Z");
  const today = new Date(dateStr + "T12:00:00Z");
  const diff = Math.floor((today - epoch) / (1000 * 60 * 60 * 24));
  return diff + 1;  // Day 1 = epoch
}

// Human-friendly date label for the player-facing UI/share, e.g. "June 1".
// (day_num stays internal — meaningless to players.)
function dayLabel(dateStr) {
  dateStr = dateStr || getETDateString();
  return new Date(dateStr + "T12:00:00Z").toLocaleDateString("en-US", { month: "long", day: "numeric" });
}

// Today's course: override > sequence rotation
function getCourseOfDay(dateStr) {
  dateStr = dateStr || getETDateString();
  if (DAILY_OVERRIDES[dateStr]) {
    const ov = ALL_COURSES.find(c => c.id === DAILY_OVERRIDES[dateStr]);
    if (ov) return ov;
  }
  const dayNum = getDayNumber(dateStr);
  if (dayNum < 1) return null;  // pre-launch
  const idx = (dayNum - 1) % DAILY_SEQUENCE.length;
  const id = DAILY_SEQUENCE[idx];
  return ALL_COURSES.find(c => c.id === id);
}

// Courses whose logos are letters/initials — distractors must match initial
const INITIALS_LOGO_COURSES = {
  "sebonack":      "S",
  "sand-hills":    "SH",
  "sand-valley-gc":"SV",
  "sheep-ranch":   "SR",
  "quarry-lq":     "Q",
  "peachtree":     "P",  // PCG technically; P is sufficient
};

// Deterministic shuffle seeded by date string
function seededShuffle(arr, seed) {
  // Simple xorshift seeded from string
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const rand = () => {
    h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
    return ((h >>> 0) % 100000) / 100000;
  };
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getDailyOptions(correctCourse, dateStr) {
  dateStr = dateStr || getETDateString();
  const correctInitial = INITIALS_LOGO_COURSES[correctCourse.id];

  let candidatePool;
  if (correctInitial) {
    // Initial-match rule: distractors must start with the same letter(s)
    candidatePool = ALL_COURSES.filter(c =>
      c.id !== correctCourse.id &&
      c.name.toUpperCase().startsWith(correctInitial.toUpperCase())
    );
    // Fallback if pool too thin — use first-letter match
    if (candidatePool.length < 3) {
      const firstChar = correctInitial[0].toUpperCase();
      candidatePool = ALL_COURSES.filter(c =>
        c.id !== correctCourse.id &&
        c.name.toUpperCase().startsWith(firstChar)
      );
    }
    // Final fallback if still thin: pull from anywhere
    if (candidatePool.length < 3) {
      candidatePool = ALL_COURSES.filter(c => c.id !== correctCourse.id);
    }
  } else {
    candidatePool = ALL_COURSES.filter(c => c.id !== correctCourse.id);
  }

  // Deterministic shuffle by date — every player gets same options
  const shuffled = seededShuffle(candidatePool, dateStr + correctCourse.id);
  const distractors = shuffled.slice(0, 3);
  const allOpts = seededShuffle([...distractors, correctCourse], dateStr + "-final");
  return {
    opts: allOpts,
    ansIdx: allOpts.findIndex(o => o.id === correctCourse.id)
  };
}
