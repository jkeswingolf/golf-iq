const STREAK_PAUSE_MAX = 7;  // miss 7+ days and streak resets

// Merge two play-history arrays into one entry-per-day list (sorted).
// Used to combine device-local history with the authoritative cloud
// record so the streak reflects ALL devices, not just the current one.
function mergeDailyHistory(a, b) {
  const byDay = {};
  (a || []).forEach(function(e){ if (e && e.day) byDay[e.day] = e; });
  (b || []).forEach(function(e){ if (e && e.day) byDay[e.day] = e; }); // cloud wins on conflict
  return Object.keys(byDay).sort().map(function(k){ return byDay[k]; });
}

// dailyHistory: array of { day: "YYYY-MM-DD", correct: boolean }
function computeStreak(dailyHistory, today) {
  today = today || getETDateString();
  if (!dailyHistory || dailyHistory.length === 0) {
    return { state: "fresh", streak: 0 };
  }

  // Sort chronologically
  const history = [...dailyHistory].sort((a, b) => a.day.localeCompare(b.day));
  const last = history[history.length - 1];

  // If the last play was wrong, streak is broken regardless of timing
  // BUT only if it's the most recent attempt — we walk back from the end
  // and count consecutive correct days.

  let streak = 0;
  let lastCorrectDay = null;     // oldest day of the consecutive run (walks backward)
  let newestCorrectDay = null;   // most recent correct day — what staleness is measured from
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].correct) {
      // Check chronological continuity
      if (lastCorrectDay === null) {
        lastCorrectDay = history[i].day;
        newestCorrectDay = history[i].day;
        streak = 1;
      } else {
        const gap = daysBetween(history[i].day, lastCorrectDay);
        if (gap === 1) {
          streak++;
          lastCorrectDay = history[i].day;
        } else {
          break;  // gap in correct answers — streak ends here
        }
      }
    } else {
      // Wrong answer breaks the streak
      if (lastCorrectDay === null) {
        return { state: "broken", streak: 0 };
      }
      break;
    }
  }

  if (streak === 0) return { state: "fresh", streak: 0 };

  // Staleness is measured from the MOST RECENT play, not the start of the run.
  const daysSince = daysBetween(newestCorrectDay, today);

  if (daysSince === 0) {
    // Played today, correct — active
    return { state: "active", streak, lastPlayedDay: newestCorrectDay };
  }
  if (daysSince <= STREAK_PAUSE_MAX) {
    return { state: "paused", streak, daysSinceLastPlay: daysSince };
  }
  // Beyond pause window — broken
  return { state: "broken", streak: 0 };
}

function daysBetween(dayA, dayB) {
  const a = new Date(dayA + "T12:00:00Z");
  const b = new Date(dayB + "T12:00:00Z");
  return Math.round((b - a) / (1000 * 60 * 60 * 24));
}

// Longest run of consecutive correct days that falls WITHIN the given month
// (monthStr "YYYY-MM"), ending at the player's most recent correct day in that
// month. This is what the monthly leaderboard ranks on — it resets each month,
// so every month is a fresh race. (All-time streak is tracked separately.)
function monthStreak(dailyHistory, monthStr) {
  if (!dailyHistory || !dailyHistory.length) return 0;
  const inMonth = dailyHistory
    .filter(h => h.correct && h.day.startsWith(monthStr))
    .sort((a, b) => a.day.localeCompare(b.day));
  if (!inMonth.length) return 0;
  let best = 1, run = 1;
  for (let i = 1; i < inMonth.length; i++) {
    if (daysBetween(inMonth[i-1].day, inMonth[i].day) === 1) { run++; if (run > best) best = run; }
    else run = 1;
  }
  return best;
}

function generateDailyShare(dayStr, timeMs, correct, streakInfo) {
  const sec = (timeMs / 1000).toFixed(1);
  const emoji = correct ? "⛳" : "💨";
  const result = correct ? `got it in ${sec}s` : `missed in ${sec}s`;
  let streakBit = "";
  if (streakInfo.state === "active" && streakInfo.streak > 1) {
    streakBit = ` 🔥${streakInfo.streak} streak`;
  }
  return `Golf Course IQ — ${dayLabel(dayStr)}\n${emoji} ${result}${streakBit}\n\nPlay → golf-iq.app`;
}

const dailyDb = {
  // Log a Daily Course play. Always called whether correct or wrong.
  // Powers analytics, monthly leaderboard, and silent GOAT tracking.
  logPlay: async function({ username, dayNum, dayStr, courseId, correct, timeMs, streakAfter }) {
    try {
      await fetch(SB_URL + "/rest/v1/daily_plays", {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({
          username: normalizeUsername(username), display_name: username, day_num: dayNum, day_str: dayStr,
          course_id: courseId, correct, time_ms: timeMs,
          streak_after: streakAfter
        })
      });
    } catch(e) { console.error("daily logPlay failed:", e); }
  },

  // Fetch this user's FULL play history from the cloud, newest-first,
  // mapped to the local dailyHistory shape. This is the authoritative
  // cross-device record — the streak is computed from this, not from
  // whatever happens to be cached on the current device.
  getAllPlays: async function(username) {
    if (!username) return [];
    try {
      const r = await fetch(
        SB_URL + "/rest/v1/daily_plays?username=eq." + encodeURIComponent(normalizeUsername(username)) +
        "&order=day_str.asc&select=day_str,day_num,course_id,correct,time_ms",
        { headers: SB_HEADERS }
      );
      if (!r.ok) return [];
      const rows = await r.json();
      return rows.map(function(row) {
        return { day: row.day_str, dayNum: row.day_num, courseId: row.course_id,
                 correct: row.correct, timeMs: row.time_ms };
      });
    } catch(e) { return []; }
  },

  // Check whether this user has already played today (prevents replay)
  hasPlayedToday: async function(username, dayStr) {
    try {
      const r = await fetch(
        SB_URL + "/rest/v1/daily_plays?username=eq." + encodeURIComponent(normalizeUsername(username)) +
        "&day_str=eq." + dayStr + "&select=correct,time_ms",
        { headers: SB_HEADERS }
      );
      if (!r.ok) return null;
      const rows = await r.json();
      return rows.length > 0 ? rows[0] : null;
    } catch(e) { return null; }
  },

  // Upsert into monthly streak leaderboard. allTimeStreak is optional — the
  // monthly board ranks on current_streak (month-scoped); all_time_streak is
  // carried only so the leaderboard can show a quiet 🔥 badge per player.
  upsertMonthlyStreak: async function({ username, monthStr, currentStreak, totalTimeMs, playsThisMonth, allTimeStreak }) {
    try {
      const body = {
        username: normalizeUsername(username), display_name: username, month_str: monthStr,
        current_streak: currentStreak,
        total_time_ms: totalTimeMs,
        plays_this_month: playsThisMonth
      };
      if (typeof allTimeStreak === "number") body.all_time_streak = allTimeStreak;
      await fetch(SB_URL + "/rest/v1/monthly_streaks", {
        method: "POST",
        headers: Object.assign({}, SB_HEADERS, { "Prefer": "resolution=merge-duplicates" }),
        body: JSON.stringify(body)
      });
    } catch(e) { console.error("monthly streak upsert failed:", e); }
  },

  // Fetch current month leaderboard, top N + caller's rank
  getMonthlyLeaderboard: async function(monthStr, username, topN) {
    topN = topN || 10;
    try {
      // Top N by streak desc, then by total_time_ms asc (tiebreaker)
      const r = await fetch(
        SB_URL + "/rest/v1/monthly_streaks?month_str=eq." + monthStr +
        "&order=current_streak.desc,total_time_ms.asc&limit=" + topN,
        { headers: SB_HEADERS }
      );
      const top = r.ok ? await r.json() : [];

      // Caller's rank: count of users with better (streak, time)
      let myRank = null;
      if (username) {
        const me = await fetch(
          SB_URL + "/rest/v1/monthly_streaks?month_str=eq." + monthStr +
          "&username=eq." + encodeURIComponent(normalizeUsername(username)) +
          "&select=current_streak,total_time_ms",
          { headers: SB_HEADERS }
        );
        const meRows = me.ok ? await me.json() : [];
        if (meRows.length > 0) {
          const myStreak = meRows[0].current_streak;
          const myTime = meRows[0].total_time_ms;
          // Count entries that beat me
          const better = await fetch(
            SB_URL + "/rest/v1/monthly_streaks?month_str=eq." + monthStr +
            "&or=(current_streak.gt." + myStreak +
            ",and(current_streak.eq." + myStreak + ",total_time_ms.lt." + myTime + "))" +
            "&select=username",
            { headers: SB_HEADERS }
          );
          const betterRows = better.ok ? await better.json() : [];
          myRank = betterRows.length + 1;
        }
      }

      return { top, myRank };
    } catch(e) {
      console.error("leaderboard fetch failed:", e);
      return { top: [], myRank: null };
    }
  },
// Fetch the last N plays for a list of usernames (for leaderboard detail)
  getRecentPlaysForUsers: async function(usernames, n) {
    n = n || 3;
    if (!usernames || usernames.length === 0) return {};
    try {
      const userFilter = usernames.map(function(u){ return '"' + u + '"'; }).join(",");
      const r = await fetch(
        SB_URL + "/rest/v1/daily_plays?username=in.(" + encodeURIComponent(userFilter) +
        ")&order=day_str.desc&select=username,day_str,correct,time_ms",
        { headers: SB_HEADERS }
      );
      if (!r.ok) return {};
      const rows = await r.json();
      const byUser = {};
      rows.forEach(function(row) {
        if (!byUser[row.username]) byUser[row.username] = [];
        if (byUser[row.username].length < n) byUser[row.username].push(row);
      });
      return byUser;
    } catch(e) { return {}; }
  },

  // Compute caller's percentile among correct players today.
  // Returns { rank, total, percentile } or null on error.
  getPercentile: async function(username, dayStr, timeMs) {
    try {
      // Count total correct plays today
      const rTotal = await fetch(
        SB_URL + "/rest/v1/daily_plays?day_str=eq." + dayStr +
        "&correct=eq.true&select=username",
        { headers: SB_HEADERS }
      );
      const totalRows = rTotal.ok ? await rTotal.json() : [];
      const total = totalRows.length;
      if (total === 0) return null;
      // Count correct players faster than this time
      const rFaster = await fetch(
        SB_URL + "/rest/v1/daily_plays?day_str=eq." + dayStr +
        "&correct=eq.true&time_ms=lt." + timeMs + "&select=username",
        { headers: SB_HEADERS }
      );
      const fasterRows = rFaster.ok ? await rFaster.json() : [];
      const rank = fasterRows.length + 1;
      const percentile = Math.round((1 - fasterRows.length / total) * 100);
      return { rank, total, percentile };
    } catch(e) { return null; }
  },
  // SILENT — log annual GOAT progression. No UI surfaces this in Year 1.
  // Reveal happens January 2 via separate microsite.
  logAnnualPlay: async function({ username, year, dayNum, correct, timeMs }) {
    try {
      await fetch(SB_URL + "/rest/v1/annual_goat", {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({
          username: normalizeUsername(username), display_name: username, year,
          day_num: dayNum, correct,
          time_ms: timeMs
        })
      });
    } catch(e) { /* silent */ }
  },
  // Save a player's email to the users table (Day-7 capture + future triggers).
  // Upserts on username PK; email has a UNIQUE constraint so a collision means
  // the address is already linked to another player.
  saveEmail: async function({ username, email }) {
    try {
      const r = await fetch(SB_URL + "/rest/v1/users", {
        method: "POST",
        headers: SB_HEADERS,
        body: JSON.stringify({
          username: normalizeUsername(username),
          display_name: username,
          email: (email || "").trim().toLowerCase()
        })
      });
      if (r.ok) return { ok: true };
      const txt = await r.text();
      if (r.status === 409 || /duplicate|unique/i.test(txt)) {
        return { ok: false, message: "That email is already linked to another player." };
      }
      console.error("saveEmail failed:", r.status, txt);
      return { ok: false, message: "Couldn't save right now — please try again." };
    } catch(e) {
      return { ok: false, message: "Network hiccup — please try again." };
    }
  },
};

const authDb = {
  // Send magic link to email
  sendMagicLink: async function(email) {
    try {
      const r = await fetch(SB_URL + "/auth/v1/magiclink", {
        method: "POST",
        headers: {
          "apikey": SB_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email.trim().toLowerCase(),
          options: { redirectTo: "https://golf-iq.app" }
        })
      });
      if (r.ok) return { ok: true };
      const txt = await r.text();
      // "Email not found" just means they haven't linked — surface clean message
      if (/not found|no user/i.test(txt)) {
        return { ok: false, message: "No account found for that email. Make sure it matches the email you saved on your original device." };
      }
      return { ok: false, message: "Couldn't send link right now — please try again." };
    } catch(e) {
      return { ok: false, message: "Network error — please try again." };
    }
  },

  // Exchange the token_hash from the URL for a session, then look up username
  handleMagicLinkCallback: async function() {
    try {
      // Supabase appends #access_token=...&token_type=bearer or
      // ?token_hash=...&type=magiclink depending on version.
      const hash   = window.location.hash.substring(1);
      const search = window.location.search.substring(1);
      const params = new URLSearchParams(hash || search);

      const accessToken  = params.get("access_token");
      const tokenHash    = params.get("token_hash");
      const type         = params.get("type");

      if (!accessToken && !tokenHash) return null;

      let userEmail = null;

      if (accessToken) {
        // Implicit flow — we have the token directly
        // Fetch user from Supabase Auth
        const r = await fetch(SB_URL + "/auth/v1/user", {
          headers: { "apikey": SB_KEY, "Authorization": "Bearer " + accessToken }
        });
        if (!r.ok) return null;
        const user = await r.json();
        userEmail = user.email;
      } else if (tokenHash && type === "magiclink") {
        // PKCE flow — verify the token
        const r = await fetch(SB_URL + "/auth/v1/verify", {
          method: "POST",
          headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ token_hash: tokenHash, type: "magiclink" })
        });
        if (!r.ok) return null;
        const data = await r.json();
        userEmail = data.user && data.user.email;
      }

      if (!userEmail) return null;

      // Look up username from our users table
      const ur = await fetch(
        SB_URL + "/rest/v1/users?email=eq." + encodeURIComponent(userEmail.toLowerCase()) +
        "&select=username,display_name",
        { headers: SB_HEADERS }
      );
      if (!ur.ok) return null;
      const users = await ur.json();
      if (!users.length) return null;

      return { email: userEmail, username: users[0].display_name || users[0].username };
    } catch(e) {
      console.error("Magic link callback error:", e);
      return null;
    }
  }
};

// Uses same seededShuffle logic as Daily distractors

  const pool = ALL_COURSES.filter(c => c.logoUrl || true); // full pool
  const shuffled = seededShuffle(pool, "sprint-" + dateStr);
  return shuffled.slice(0, 7);
}

const battleDb = {
  // Log a completed Sprint attempt

    try {

  },

  // Today's Field — global leaderboard for today's Sprint, top N
  getField: async function(dateStr, topN) {

  },

  // Personal best Sprint (all time)
  getPersonalBest: async function(username) {
    try {
      const r = await fetch(
        SB_URL + "/rest/v1/speed_rounds?username=eq." + encodeURIComponent(normalizeUsername(username)) +
        "&order=adjusted_ms.asc&limit=1" +

      );

    } catch(e) { return null; }

      return rows.length ? rows[0] : null;
    } catch(e) { return null; }
  },

  // ── CLUBS ────────────────────────────────────────────
  createClub: async function({ name, username }) {
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    try {
      const r = await fetch(SB_URL + "/rest/v1/clubs", {
        method: "POST",
        headers: Object.assign({}, SB_HEADERS, { "Prefer": "return=representation" }),
        body: JSON.stringify({ name, invite_code: code, created_by: normalizeUsername(username) })
      });
      if (!r.ok) { const t = await r.text(); return { ok: false, message: t }; }
      const rows = await r.json();
      const club = rows[0];
      // Auto-join creator
      await battleDb.joinClub({ code, username });
      return { ok: true, club };
    } catch(e) { return { ok: false, message: e.message }; }
  },

  joinClub: async function({ code, username }) {
    try {
      // Find club by code
      const cr = await fetch(
        SB_URL + "/rest/v1/clubs?invite_code=eq." + code.toUpperCase() + "&select=id,name",
        { headers: SB_HEADERS }
      );
      const clubs = cr.ok ? await cr.json() : [];
      if (!clubs.length) return { ok: false, message: "Club code not found. Check the code and try again." };
      const club = clubs[0];
      // Add member
      await fetch(SB_URL + "/rest/v1/club_members", {
        method: "POST",
        headers: Object.assign({}, SB_HEADERS, { "Prefer": "resolution=merge-duplicates" }),
        body: JSON.stringify({ club_id: club.id, username: normalizeUsername(username), display_name: username })
      });
      return { ok: true, club };
    } catch(e) { return { ok: false, message: e.message }; }
  },

  getMyClubs: async function(username) {
    try {
      const r = await fetch(
        SB_URL + "/rest/v1/club_members?username=eq." + encodeURIComponent(normalizeUsername(username)) +
        "&select=club_id,clubs(id,name,invite_code)",
        { headers: SB_HEADERS }
      );
      if (!r.ok) return [];
      const rows = await r.json();
      return rows.map(r => r.clubs).filter(Boolean);
    } catch(e) { return []; }
  },

  getClubStandings: async function(clubId, dateStr) {
    try {
      // Get members
      const mr = await fetch(
        SB_URL + "/rest/v1/club_members?club_id=eq." + clubId + "&select=username,display_name",
        { headers: SB_HEADERS }
      );
      const members = mr.ok ? await mr.json() : [];
      if (!members.length) return [];
      const userFilter = members.map(m => '"' + m.username + '"').join(",");
      // Get today's Sprint scores for members
      const sr = await fetch(
        SB_URL + "/rest/v1/speed_rounds?date_str=eq." + dateStr +
        "&username=in.(" + encodeURIComponent(userFilter) + ")" +
        "&order=adjusted_ms.asc&select=username,display_name,adjusted_ms,total_ms,penalty_ms,correct_count",
        { headers: SB_HEADERS }
      );
      const scores = sr.ok ? await sr.json() : [];
      // Merge members with scores (show all members, not just those who played)
      return members.map(m => {
        const score = scores.find(s => s.username === m.username);
        return Object.assign({}, m, score || { adjusted_ms: null });
      }).sort((a, b) => {
        if (a.adjusted_ms === null && b.adjusted_ms === null) return 0;
        if (a.adjusted_ms === null) return 1;
        if (b.adjusted_ms === null) return -1;
        return a.adjusted_ms - b.adjusted_ms;
      });
    } catch(e) { return []; }
  }
};


/* ═══════════════════════════════════════════════════════
   HEAD-TO-HEAD CHALLENGE — link-based 1v1
   ───────────────────────────────────────────────────────
   Flow:
     1. Challenger plays 5 seeded courses → result saved
     2. App generates share link: golf-iq.app?c=CHALLENGEID
     3. Challenger texts link to opponent
     4. Opponent taps link → plays same 5 courses
     5. After opponent finishes → both see full result
   Table: challenges
     id, seed, challenger_username, challenger_time_ms,
     challenger_correct, opponent_username, opponent_time_ms,
     opponent_correct, course_ids, created_at
═══════════════════════════════════════════════════════ */

// Generate a date + short hash label: "June 14 · #4F2"
function challengeLabel(seed) {
  const short = seed.toUpperCase().slice(0, 3);
  const today = getETDateString();
  const date = new Date(today + "T12:00:00Z").toLocaleDateString("en-US", { month: "long", day: "numeric" });
  return date + " · #" + short;
}

// Personalized label: "@Jeff v @Josh · June 14 · #4F2"
function challengeLabelPersonal(seed, userA, userB) {
  const short = seed.toUpperCase().slice(0, 3);
  const today = getETDateString();
  const date = new Date(today + "T12:00:00Z").toLocaleDateString("en-US", { month: "long", day: "numeric" });
  const players = userA && userB ? "@" + userA + " v @" + userB + " · " : userA ? "@" + userA + " · " : "";
  return players + date + " · #" + short;
}

// Short hash only (3 chars) for compact display
function challengeShort(seed) {
  return seed.toUpperCase().slice(0, 3);
}

// Get 5 courses for a challenge from a seed string
function getChallengeCourses(seed) {
  const shuffled = seededShuffle(ALL_COURSES.filter(c => c.logoUrl || true), "challenge-" + seed);
  return shuffled.slice(0, 5);
}

// Generate a random 8-char seed
function newChallengeSeed() {
  return Math.random().toString(36).substring(2, 10);
}

const challengeDb = {
  // Save challenger's attempt and get back the challenge id
  createChallenge: async function({ seed, username, correctCount, timeMs, courseIds }) {
    try {
      const r = await fetch(SB_URL + "/rest/v1/challenges", {
        method: "POST",
        headers: Object.assign({}, SB_HEADERS, { "Prefer": "return=representation" }),
        body: JSON.stringify({
          seed,
          challenger_username: normalizeUsername(username),
          challenger_display: username,
          challenger_correct: correctCount,
          challenger_time_ms: timeMs,
          course_ids: courseIds.join(",")
        })
      });
      if (!r.ok) { const t = await r.text(); console.error("createChallenge failed:", r.status, t); return null; }
      const rows = await r.json();
      return rows[0];
    } catch(e) { console.error("createChallenge error:", e); return null; }
  },

  // Fetch a challenge by seed (for opponent loading)
  getChallenge: async function(seed) {
    try {
      const r = await fetch(
        SB_URL + "/rest/v1/challenges?seed=eq." + encodeURIComponent(seed) +
        "&select=*&limit=1",
        { headers: SB_HEADERS }
      );
      if (!r.ok) return null;
      const rows = await r.json();
      return rows.length ? rows[0] : null;
    } catch(e) { return null; }
  },

  // Save opponent's result
  completeChallenge: async function({ seed, username, correctCount, timeMs }) {
    try {
      const r = await fetch(
        SB_URL + "/rest/v1/challenges?seed=eq." + encodeURIComponent(seed),
        {
          method: "PATCH",
          headers: SB_HEADERS,
          body: JSON.stringify({
            opponent_username: normalizeUsername(username),
            opponent_display: username,
            opponent_correct: correctCount,
            opponent_time_ms: timeMs
          })
        }
      );
      return r.ok;
    } catch(e) { return false; }
  }
};

/* ═══════════════════════════════════════════════════════
   EMAIL SOFT NUDGE — Day 3+, slim one-line prompt
   Lower friction than the Day-7 full card.
   Dismisses permanently. Never shown after email saved.
═══════════════════════════════════════════════════════ */
function EmailSoftNudge({ profile, onSave, onDismiss, context }) {
  const [expanded, setExpanded] = useState(false);
  const [email, setEmail]       = useState("");
  const [status, setStatus]     = useState("idle"); // idle | saving | done | error
  const [msg, setMsg]           = useState("");

  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());

  const submit = async () => {
    if (!valid) return;
    setStatus("saving");
    const res = await onSave(email.trim());
    if (res && res.ok) { setStatus("done"); }
    else { setStatus("error"); setMsg((res && res.message) || "Try again."); }
  };

  if (status === "done") return (
    <div style={{padding:"10px 14px",background:"rgba(40,200,90,.08)",
      borderRadius:8,border:"1px solid rgba(40,200,90,.2)",
      fontSize:12,color:"rgba(150,220,150,.8)",textAlign:"center"}}>
      ✓ Email saved — your streak is protected across devices.
    </div>
  );

  const nudgeText = context === "leaderboard"
    ? "Protect your spot on the board across devices →"
    : "Playing on multiple devices? Protect your streak →";

  if (!expanded) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
      padding:"9px 14px",background:"rgba(200,168,75,.06)",
      borderRadius:8,border:"1px solid rgba(200,168,75,.15)",cursor:"pointer"}}
      onClick={() => setExpanded(true)}>
      <div style={{fontSize:12,color:"rgba(200,168,75,.65)"}}>{nudgeText}</div>
      <div style={{fontSize:11,color:"rgba(200,168,75,.4)",flexShrink:0,marginLeft:8}}>
        tap →
      </div>
    </div>
  );

  return (
    <div style={{padding:"14px",background:"rgba(200,168,75,.07)",
      borderRadius:8,border:"1px solid rgba(200,168,75,.2)"}}>
      <div style={{fontSize:12,color:"rgba(200,168,75,.7)",marginBottom:10,lineHeight:1.4}}>
        Save your email to sync your streak across devices. No password, no spam.
      </div>
      <input
        type="email" inputMode="email" placeholder="you@email.com"
        value={email} onChange={e => setEmail(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") submit(); }}
        style={{width:"100%",padding:"10px 12px",borderRadius:6,
          background:"rgba(0,0,0,.25)",border:"1px solid rgba(200,168,75,.25)",
          color:"#f0dfa0",fontSize:14,outline:"none",boxSizing:"border-box",
          marginBottom:8}}/>
      {status === "error" && (
        <div style={{fontSize:11,color:"#e08a8a",marginBottom:8}}>{msg}</div>
      )}
      <div style={{display:"flex",gap:8}}>
        <button className="gi-btn gi-btn-gold" style={{flex:1,padding:"10px",fontSize:13}}
          disabled={!valid || status === "saving"} onClick={submit}>
          {status === "saving" ? "Saving…" : "Save →"}
        </button>
        <button className="gi-btn gi-btn-ghost" style={{fontSize:12,padding:"10px 12px"}}
          onClick={() => { setExpanded(false); onDismiss && onDismiss(); }}>
          Not now
        </button>
      </div>
    </div>
  );
}

    if (!valid) return;
    setStatus("saving"); setMsg("");

      border:"1px solid rgba(200,168,75,.35)"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:20}}>🔥</span>
        <div className="gi-serif gi-gold" style={{fontSize:17,fontWeight:700,lineHeight:1.1}}>
          {streak.streak}-day streak — nice.
        </div>
      </div>
      <div style={{fontSize:13,color:"rgba(200,180,140,.7)",marginTop:8,lineHeight:1.45}}>
        Add your email to <b style={{color:"#f0dfa0"}}>save your streak across devices</b> and get notified
        when tournament-week rounds go live. No spam, no password — ever.
      </div>

      <input
        type="email" inputMode="email" placeholder="you@email.com"
        value={email} onChange={e=>setEmail(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter") submit(); }}
        style={{width:"100%",marginTop:12,padding:"12px 14px",borderRadius:8,
          background:"rgba(0,0,0,.25)",border:"1px solid rgba(200,168,75,.25)",
          color:"#f0dfa0",fontSize:15,outline:"none",boxSizing:"border-box"}} />

      {status === "error" && (
        <div style={{fontSize:12,color:"#e08a8a",marginTop:8}}>{msg}</div>
      )}

      <div style={{display:"flex",gap:10,marginTop:12}}>
        <button className="gi-btn gi-btn-gold" style={{flex:1,padding:"12px"}}
          disabled={!valid || status==="saving"}
          onClick={submit}>
          {status==="saving" ? "Saving…" : "Save my streak"}
        </button>
        <button className="gi-btn gi-btn-ghost" style={{padding:"12px 14px"}}
          onClick={onDismiss}>
          Not now
        </button>
      </div>
    </div>
  );
}


/* ═══════════════════════════════════════════════════════
   DAILY RESULT SCREEN — single scrollable post-play page
   ───────────────────────────────────────────────────────
   Replaces the old "done" phase inline JSX in DailyScreen.
   Flow: result hero → percentile → course share → inline
   leaderboard → sticky share footer.
═══════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════
   MILESTONE SHARE — surfaces automatically at key moments
   ───────────────────────────────────────────────────────
   Returns { text, label } or null if no milestone today.
   Priority: highest streak milestone wins.

   -- 5. Speed rounds (Friend Battle / Sprint)
   CREATE TABLE IF NOT EXISTS speed_rounds (
     id BIGSERIAL PRIMARY KEY,
     username TEXT NOT NULL,
     display_name TEXT,
     date_str TEXT NOT NULL,
     total_ms INTEGER NOT NULL,
     penalty_ms INTEGER NOT NULL DEFAULT 0,
     adjusted_ms INTEGER NOT NULL,
     correct_count INTEGER NOT NULL,
     course_ids TEXT,
     created_at TIMESTAMPTZ DEFAULT NOW(),
     UNIQUE(username, date_str)
   );
   CREATE INDEX IF NOT EXISTS idx_sr_date ON speed_rounds(date_str, adjusted_ms ASC);
   ALTER TABLE speed_rounds ENABLE ROW LEVEL SECURITY;
   CREATE POLICY "sr_all" ON speed_rounds FOR ALL USING (true) WITH CHECK (true);

   -- 6. Clubs (Friend Battle groups)
   CREATE TABLE IF NOT EXISTS clubs (
     id BIGSERIAL PRIMARY KEY,
     name TEXT NOT NULL,
     invite_code TEXT NOT NULL UNIQUE,
     created_by TEXT NOT NULL,
     created_at TIMESTAMPTZ DEFAULT NOW()
   );
   ALTER TABLE clubs ENABLE ROW LEVEL SECURITY;
   CREATE POLICY "clubs_all" ON clubs FOR ALL USING (true) WITH CHECK (true);

   -- 7. Club members
   CREATE TABLE IF NOT EXISTS club_members (
     club_id BIGINT NOT NULL REFERENCES clubs(id),
     username TEXT NOT NULL,
     display_name TEXT,
     joined_at TIMESTAMPTZ DEFAULT NOW(),
     PRIMARY KEY (club_id, username)
   );
   ALTER TABLE club_members ENABLE ROW LEVEL SECURITY;
   CREATE POLICY "cm_all" ON club_members FOR ALL USING (true) WITH CHECK (true);


   -- 8. Head-to-Head Challenges
   CREATE TABLE IF NOT EXISTS challenges (
     id BIGSERIAL PRIMARY KEY,
     seed TEXT NOT NULL UNIQUE,
     challenger_username TEXT NOT NULL,
     challenger_display TEXT,
     challenger_correct INTEGER NOT NULL,
     challenger_time_ms INTEGER NOT NULL,
     opponent_username TEXT,
     opponent_display TEXT,
     opponent_correct INTEGER,
     opponent_time_ms INTEGER,
     course_ids TEXT,
     created_at TIMESTAMPTZ DEFAULT NOW()
   );
   CREATE INDEX IF NOT EXISTS idx_ch_seed ON challenges(seed);
   ALTER TABLE challenges ENABLE ROW LEVEL SECURITY;
   CREATE POLICY "ch_all" ON challenges FOR ALL USING (true) WITH CHECK (true);

   ═══════════════════════════════════════════════════════ */
function getMilestoneShare(streakInfo, dailyHistory, courseName, timeMs) {
  const streak = streakInfo.streak;
  const totalCorrect = (dailyHistory || []).filter(h => h.correct).length;
  const sec = (timeMs / 1000).toFixed(1);

  // Streak milestones — highest wins
  if (streak === 100) return {
    label: "💯 100-DAY STREAK",
    text: `100 days. 100 correct. 🔥\n\nI've been on a 100-day streak on Golf IQ — a new course logo every day, one guess, no do-overs.\n\nThink you know your courses?\nhttps://golf-iq.app`
  };
  if (streak === 30) return {
    label: "🔥 30-DAY STREAK",
    text: `30-day streak on Golf IQ. ⛳\n\n30 course logos. 30 correct in a row.\n\nCan you keep up?\nhttps://golf-iq.app`
  };
  if (streak === 7) return {
    label: "🔥 7-DAY STREAK",
    text: `One week straight on Golf IQ. 🔥\n\nA new course logo every day. One guess. No do-overs.\n\nChallenge yourself — if you dare.\nhttps://golf-iq.app`
  };
  // First correct ever
  if (totalCorrect === 1) return {
    label: "⛳ FIRST ONE DOWN",
    text: `Just got my first one on Golf IQ ⛳\n\n${courseName} in ${sec}s.\n\nDaily course logo puzzle — one guess, no do-overs.\nhttps://golf-iq.app`
  };
  return null;
}

function DailyResultScreen({ profile, course, result, dayStr, logos, onBack, onViewLeaderboard, onSaveEmail, onDismissEmail, hadEmailAtMount, dailyHistory }) {

  const [lbLoading, setLbLoading]   = useState(true);
  const [emailHidden, setEmailHidden] = useState(false);
  const [milestoneCopied, setMilestoneCopied] = useState(false);

  const streak    = result.streakInfo;
  const monthStr  = dayStr.slice(0, 7);
  const milestone = result.correct ? getMilestoneShare(streak, dailyHistory || [], course.name, result.timeMs) : null;
  const today     = getETDateString();

  // Fetch percentile + leaderboard in parallel
  useEffect(() => {
    (async () => {
      const [pct, lb] = await Promise.all([
        result.correct ? dailyDb.getPercentile(profile && profile.username, dayStr, result.timeMs) : Promise.resolve(null),
        dailyDb.getMonthlyLeaderboard(monthStr, profile && profile.username, 10)
      ]);
      setPercentile(pct);
      // Also fetch recent plays for leaderboard rows
      const usernames = (lb.top || []).map(r => r.username);
      const recentPlays = await dailyDb.getRecentPlaysForUsers(usernames, 8);
      setLbData(Object.assign({}, lb, { recentPlays }));
      setLbLoading(false);
    })();
  }, []);

  // ── Share strings ──────────────────────────────────────────────────────────
  const sec = (result.timeMs / 1000).toFixed(1);
  const streakBit = streak.state === "active" && streak.streak > 1 ? ` 🔥${streak.streak} streak` : "";

  // Generic daily share (spoiler-free)
  const dailyShareText =
    `Golf IQ — ${dayLabel(dayStr)}\n` +
    (result.correct ? `⛳ Got it in ${sec}s${streakBit}` : `💨 Missed in ${sec}s`) + `\n\n` +
    `https://golf-iq.app`;

  // Course-specific share — surfaces the course name, perfect for group chats
  const courseShareText =
    `${course.name} came up on Golf IQ today ⛳\n` +
    (result.correct ? `Got it in ${sec}s 🔥` : `Missed it 💨`) + `\n\n` +
    `Think you know your courses by logo alone?\nhttps://golf-iq.app`;

  const copy = async (text, setCb) => {
    try { await navigator.clipboard.writeText(text); setCb(true); setTimeout(() => setCb(false), 2200); }
    catch(e) { alert(text); }
  };

  // ── Result hero copy ──────────────────────────────────────────────────────
  const resultMsg = result.correct
    ? streak.streak >= 7 ? "🔥 ON FIRE"
    : streak.streak >= 3 ? "🎯 DIALED IN"
    : "⛳ WELL PLAYED"
    : "💨 SAND TRAP";

  // ── Inline leaderboard helpers ────────────────────────────────────────────
  const windowEnd = today;
  const dayCols = [];
  const _endD = new Date(windowEnd + "T12:00:00Z");
  for (let i = 4; i >= 0; i--) {
    const d = new Date(_endD); d.setUTCDate(_endD.getUTCDate() - i);
    dayCols.push(d.toISOString().slice(0, 10));
  }
  const firstInMonthIdx = dayCols.findIndex(ds => ds.slice(0, 7) === monthStr);
  const hasPrevMonth = firstInMonthIdx > 0;
  const meKey = profile ? normalizeUsername(profile.username) : null;
  const myLbPlays = (lbData && lbData.recentPlays && meKey && lbData.recentPlays[meKey]) || [];
  const playedToday = myLbPlays.some(p => p.day_str === today) || result !== null;

  let myRank = lbData && lbData.myRank;
  if (lbData && !myRank && profile) {
    const idx = (lbData.top || []).findIndex(r => r.username === normalizeUsername(profile.username));
    if (idx >= 0) myRank = idx + 1;
  }

  return (
    <div className="gi-app" style={{minHeight:"100vh",paddingBottom:80}}>
      <div className="gi-stars"/>
      <div className="gi-screen" style={{maxWidth:480,margin:"0 auto",padding:"20px 16px",display:"flex",flexDirection:"column",gap:16}}>

        {/* ── Header ── */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← HOME</button>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700}}>DAILY COURSE</div>
            <div className="gi-serif gi-gold" style={{fontSize:18,fontWeight:700,lineHeight:1}}>{dayLabel(dayStr)}</div>
          </div>
        </div>

        {/* ── Result hero ── */}
        <div className="gi-card" style={{padding:"24px 20px",textAlign:"center"}}>
          <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700,marginBottom:10}}>{resultMsg}</div>
          <div className="gi-logo-ring" style={{width:130,height:130,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <CourseLogo course={course} size={130} uploadedData={logos && logos[course.id]}/>
          </div>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:26,fontWeight:700,marginTop:14,color:"#f0dfa0",lineHeight:1.1}}>
            {course.name}
          </div>
          <div style={{fontSize:13,color:"rgba(200,180,140,.6)",marginTop:4}}>📍 {course.loc}</div>

          {/* Time + streak stats */}
          <div style={{display:"flex",gap:0,justifyContent:"center",marginTop:18,paddingTop:14,
            borderTop:"1px solid rgba(200,168,75,.15)"}}>
            <div style={{flex:1,textAlign:"center"}}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:28,color:"#f0dfa0",fontWeight:700}}>{sec}s</div>
              <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".1em",marginTop:3}}>YOUR TIME</div>
            </div>
            <div style={{width:1,background:"rgba(200,168,75,.2)",margin:"0 4px"}}/>
            <div style={{flex:1,textAlign:"center"}}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:28,
                color: streak.state==="active" ? "#f0dfa0" : streak.state==="paused" ? "#888" : "#666",fontWeight:700}}>
                {streak.streak > 0 ? "🔥" + streak.streak : "—"}
              </div>
              <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".1em",marginTop:3}}>
                {streak.state==="paused" ? "PAUSED" : "BEST STREAK"}

            </div>
            {percentile && (
              <>
                <div style={{width:1,background:"rgba(200,168,75,.2)",margin:"0 4px"}}/>

                    {percentile.percentile}%
                  </div>
                  <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".1em",marginTop:3}}>TOP TODAY</div>
                </div>

          </div>

          {/* Paused warning */}
          {streak.state === "paused" && (

              borderRadius:6,fontSize:12,color:"rgba(200,200,200,.7)",fontStyle:"italic"}}>
              Your {streak.streak}-day streak is paused. Play tomorrow to keep it alive.
            </div>
          )}
        </div>

        {/* ── Email soft nudge — Day 3+ (below Day-7 threshold) ── */}
        {result.correct && streak.state === "active" && streak.streak >= 3 && streak.streak < 7
          && profile && !hadEmailAtMount && !(profile && profile.emailPromptDismissed) && !emailHidden && (
          <EmailSoftNudge
            profile={profile}
            context="result"
            onSave={onSaveEmail}
            onDismiss={() => { setEmailHidden(true); onDismissEmail && onDismissEmail(); }}

        {/* ── Email capture — Day-7 earned moment ── */}
        {result.correct && streak.state === "active" && streak.streak >= 7
          && profile && !hadEmailAtMount && !(profile && profile.emailPromptDismissed) && !emailHidden && (
          <EmailCapture
            profile={profile}
            streak={streak}
            onSave={onSaveEmail}
            onDismiss={() => { setEmailHidden(true); onDismissEmail && onDismissEmail(); }}
          />
        )}


        {/* ── Milestone share — auto-surfaces at key moments ── */}
        {milestone && (
          <div className="gi-card" style={{padding:"18px 20px",
            background:"linear-gradient(135deg,rgba(200,168,75,.18),rgba(200,168,75,.06))",
            border:"1px solid rgba(200,168,75,.5)"}}>
            <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.7)",fontWeight:700,marginBottom:6}}>
              {milestone.label}
            </div>
            <div style={{fontSize:13,color:"rgba(200,180,140,.75)",lineHeight:1.5,marginBottom:12,fontStyle:"italic"}}>
              "{milestone.text.split("\n")[0]}"
            </div>
            <button className="gi-btn gi-btn-gold" style={{width:"100%",padding:"12px",fontSize:14}}
              onClick={() => copy(milestone.text, setMilestoneCopied)}>

        {/* ── Month-end glory share — last day of month only ── */}
        {(()=>{
          const lastDay = lastDayOfMonth(monthStr);
          const isLastDay = dayStr === lastDay;
          const myTrophy = monthlyTrophy(myRank);
          if (!isLastDay || !myTrophy || !myRank) return null;
          const monthName = new Date(monthStr + "-15").toLocaleString("en-US",{month:"long",year:"numeric"});

          <div style={{fontSize:12,color:"rgba(200,180,140,.65)",lineHeight:1.5,marginBottom:12}}>

              <div style={{fontSize:10,color:"rgba(200,168,75,.4)",letterSpacing:".1em"}}>

          {/* ── Email nudge on inline board ── */}
          {profile && !profile.email && !profile.emailPromptDismissed && streak.streak >= 1 && (

              profile={profile}
              context="leaderboard"

              onDismiss={() => {}}

          {lbLoading && (
            <div style={{textAlign:"center",color:"rgba(200,168,75,.4)",padding:24,fontSize:13}}>Loading board…</div>

                    const c = getCourseOfDay(ds);

                    const out = ci < firstInMonthIdx;
                    const divider = hasPrevMonth && ci === firstInMonthIdx;

                      </div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat("+dayCols.length+",1fr)",gap:6}}>
                      {dayCols.map((ds, ci) => {
                        const out = ci < firstInMonthIdx;
                        const divider = hasPrevMonth && ci === firstInMonthIdx;
                        const base = {textAlign:"center",borderLeft:divider?"1px solid rgba(240,208,96,.4)":"none"};
                        const p = byDate[ds];
                        if (!p) return <div key={ds} style={Object.assign({fontSize:13,color:"rgba(200,168,75,.18)"},base)}>·</div>;
                        const t = (p.time_ms/1000).toFixed(1) + "s";
                        return p.correct
                          ? <div key={ds} style={Object.assign({fontSize:12,fontWeight:600,color:out?"rgba(232,213,160,.45)":"#e8d5a0"},base)}>{t}</div>
                          : <div key={ds} style={Object.assign({fontSize:11,color:out?"rgba(217,138,106,.5)":"#d98a6a"},base)}>💨{t}</div>;
                      })}
                    </div>
                  </div>
                );
              })}

function DailyScreen({ profile, logos, dailyHistory, onComplete, onBack, onViewLeaderboard, onSaveEmail, onDismissEmail }) {
  const [phase, setPhase]         = useState("loading"); // loading | playing | sel | done
  const [todayPlay, setTodayPlay] = useState(null);  // server's record if already played
  const [course, setCourse]       = useState(null);
  const [optsData, setOptsData]   = useState(null);
  const [selectedOpt, setSel]     = useState(null);
  const [elapsed, setElapsed]     = useState(0);
  const [result, setResult]       = useState(null);  // { correct, timeMs, streakInfo }
  const [copied, setCopied]       = useState(false);
  const [emailHidden, setEmailHidden] = useState(false);
  const [milestoneCopied, setMilestoneCopied] = useState(false);
  const [mergedHistory, setMergedHistory] = useState(null);
  const hadEmailAtMount = useRef(!!(profile && profile.email)).current;
  const qStart                    = useRef(0);
  const timerRef                  = useRef(null);

  const dayStr = getETDateString();
  const dayNum = getDayNumber(dayStr);

  // Mount: check if already played today
  useEffect(() => {
    (async () => {
      const c = getCourseOfDay(dayStr);
      if (!c) { setPhase("notlive"); return; }
      setCourse(c);
      setOptsData(getDailyOptions(c, dayStr));

      // Pull the authoritative cross-device history from the cloud and merge
      // with whatever this device has locally. The streak is computed from
      // this union so playing on a different device never shows a false "paused".
      let merged = dailyHistory || [];
      if (profile && profile.username) {
        const cloud = await dailyDb.getAllPlays(profile.username);
        merged = mergeDailyHistory(dailyHistory, cloud);
        setMergedHistory(merged);
      } else {
        setMergedHistory(merged);
      }

      // Check merged history for today's play (covers all devices)
      const localToday = merged.find(h => h.day === dayStr);
      if (localToday) {
        const streakInfo = computeStreak(merged, dayStr);
        setResult({ correct: localToday.correct, timeMs: localToday.timeMs, streakInfo });
        setPhase("done");
        return;
      }

      // Not played anywhere — start puzzle
      qStart.current = Date.now();
      timerRef.current = setInterval(() => setElapsed(Date.now() - qStart.current), 87);
      setPhase("playing");
    })();
    return () => clearInterval(timerRef.current);
  }, []);

  const choose = (optIdx) => {
    if (phase !== "playing") return;
    clearInterval(timerRef.current);
    const t = Date.now() - qStart.current;
    const correct = optIdx === optsData.ansIdx;
    setSel(optIdx);
    setPhase("sel");
    playClick();

    setTimeout(async () => {
      correct ? playCupIn() : playWrong();

      // Build new history entry
      const entry = { day: dayStr, dayNum, courseId: course.id, correct, timeMs: t };
      const baseHistory = mergedHistory || dailyHistory || [];
      const newHistory = mergeDailyHistory(baseHistory, [entry]);
      const streakInfo = computeStreak(newHistory, dayStr);

      setResult({ correct, timeMs: t, streakInfo });
      setPhase("done");

      // Persist locally
      onComplete(entry, streakInfo);

      // Persist to Supabase
      if (profile && profile.username) {
        await dailyDb.logPlay({
          username: profile.username,
          dayNum, dayStr,
          courseId: course.id,
          correct, timeMs: t,
          streakAfter: streakInfo.streak
        });

        // Silent annual GOAT logging
        const year = parseInt(dayStr.slice(0, 4), 10);
        dailyDb.logAnnualPlay({
          username: profile.username,
          year, dayNum, correct, timeMs: t
        });

        // Update monthly leaderboard — ranked on streak earned WITHIN this month
        const monthStr = dayStr.slice(0, 7);
        const monthHistory = newHistory.filter(h => h.day.startsWith(monthStr));
        const monthTimeMs = monthHistory.reduce((s, h) => s + h.timeMs, 0);
        dailyDb.upsertMonthlyStreak({
          username: profile.username,
          monthStr,
          currentStreak: monthStreak(newHistory, monthStr),
          totalTimeMs: monthTimeMs,
          playsThisMonth: monthHistory.length,
          allTimeStreak: streakInfo.streak
        });
      }
    }, 480);
  };

  const optState = (i) => {
    if (phase === "playing") return "idle";
    if (phase === "sel")     return i === selectedOpt ? "sel" : "idle";
    if (i === optsData.ansIdx) return "ok";
    if (i === selectedOpt)     return "bad";
    return "idle";
  };

  const shareText = result ? generateDailyShare(dayStr, result.timeMs, result.correct, result.streakInfo) : "";

  const copy = async () => {
    try { await navigator.clipboard.writeText(shareText); setCopied(true); setTimeout(()=>setCopied(false), 2200); }
    catch(e) { alert(shareText); }
  };

  // ── LOADING ──
  if (phase === "loading") {
    return (
      <div className="gi-app" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
        <div className="gi-stars"/>
        <div style={{fontSize:14,color:"rgba(200,168,75,.4)",letterSpacing:".2em"}}>LOADING DAILY…</div>
      </div>
    );
  }

  // ── PRE-LAUNCH ──
  if (phase === "notlive") {
    return (
      <div className="gi-app" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div className="gi-stars"/>
        <div className="gi-screen" style={{maxWidth:420,padding:"32px 24px",textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:12}}>⛳</div>
          <div className="gi-serif gi-gold" style={{fontSize:28,fontWeight:900}}>Daily Course</div>
          <div style={{color:"rgba(200,180,140,.6)",fontSize:14,marginTop:12}}>
            The Daily Course launches {DAILY_EPOCH}.
          </div>
          <button className="gi-btn gi-btn-outline" onClick={onBack} style={{marginTop:24}}>← BACK</button>
        </div>
      </div>
    );
  }

  // ── PLAYING ──
  if (phase === "playing" || phase === "sel") {
    const isOver6s = elapsed > 6000;
    return (
      <div className="gi-app" style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
        <div className="gi-stars"/>
        <div className="gi-screen" style={{flex:1,display:"flex",flexDirection:"column",maxWidth:520,margin:"0 auto",width:"100%",padding:"18px 16px",gap:14}}>

          {/* Header */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <button className="gi-btn gi-btn-ghost" onClick={onBack} style={{padding:"8px 0"}}>← BACK</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:11,letterSpacing:".14em",color:"rgba(200,168,75,.5)",fontWeight:700}}>DAILY COURSE</div>
              <div className="gi-serif gi-gold" style={{fontSize:20,fontWeight:700,lineHeight:1}}>{dayLabel(dayStr)}</div>
            </div>
            <div className={`gi-timer ${isOver6s?"gi-timer-fast":""}`} style={{fontSize:20}}>{fmtFull(elapsed)}</div>
          </div>

          {/* Logo */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"20px 0",position:"relative",flex:1,justifyContent:"center"}}>
            <div className="gi-spotlight" style={{width:280,height:280}}/>
            <div className="gi-logo-ring" style={{width:168,height:168,position:"relative",zIndex:1}}>
              <CourseLogo course={course} size={168} uploadedData={logos && logos[course.id]}/>
            </div>
            <div style={{marginTop:18,textAlign:"center",position:"relative",zIndex:1}}>
              <div style={{fontSize:13,color:"rgba(200,180,140,.5)",letterSpacing:".06em"}}>
                One puzzle. One guess. No do-overs.
              </div>
            </div>
          </div>

          {/* Options */}
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {optsData.opts.map((opt, i) => (
              <OptBtn key={opt.id} letter={"ABCD"[i]} option={opt}
                state={optState(i)} onClick={()=>choose(i)} disabled={phase!=="playing"}/>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── DONE — delegate to DailyResultScreen ──
  return (
    <DailyResultScreen
      profile={profile}
      course={course}
      result={result}
      dayStr={dayStr}
      logos={logos}
      dailyHistory={mergedHistory || dailyHistory}
      onBack={onBack}
      onSaveEmail={onSaveEmail}
      onDismissEmail={onDismissEmail}
      hadEmailAtMount={hadEmailAtMount}
      onViewLeaderboard={onViewLeaderboard}
    />
  );
}

function monthlyTrophy(rank) {
  if (!rank) return null;
  if (rank === 1)  return { medal: "🥇", tier: "Gold",   label: "Champion" };
  if (rank <= 3)   return { medal: "🥈", tier: "Silver", label: "Podium" };
  if (rank <= 10)  return { medal: "🥉", tier: "Bronze", label: "Top 10" };
  return null;
}

// Shift an ET "YYYY-MM" month string by N months (N negative = past).
function shiftMonth(monthStr, delta) {
  const y = parseInt(monthStr.slice(0,4),10);
  const m = parseInt(monthStr.slice(5,7),10) - 1 + delta; // 0-indexed
  const d = new Date(Date.UTC(y, m, 15));
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0");
}

// Last calendar day (YYYY-MM-DD) of an ET "YYYY-MM" month.
function lastDayOfMonth(monthStr) {
  const y = parseInt(monthStr.slice(0,4),10), mo = parseInt(monthStr.slice(5,7),10);
  return new Date(Date.UTC(y, mo, 0)).toISOString().slice(0,10);
}

  const [copied, setCopied] = useState(false);

  const currentMonth = getETDateString().slice(0, 7);
  const monthStr = shiftMonth(currentMonth, offset);
  const isCurrent = offset === 0;
  const monthName = new Date(monthStr + "-15").toLocaleString("en-US", { month: "long", year: "numeric" });

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      const d = await dailyDb.getMonthlyLeaderboard(monthStr, profile && profile.username, 10);
      const usernames = d.top.map(function(r){ return r.username; });
      const recentPlays = await dailyDb.getRecentPlaysForUsers(usernames, 8);
      if (!cancelled) { setData(Object.assign({}, d, { recentPlays })); setLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [offset]);

  // Work out the viewing player's rank + trophy in this month
  let myRank = data && data.myRank;
  if (data && !myRank && profile) {
    const idx = data.top.findIndex(function(r){ return r.username === normalizeUsername(profile.username); });
    if (idx >= 0) myRank = idx + 1;
  }
  const myTrophy = monthlyTrophy(myRank);

  // Build the shared 5-day column window (oldest -> newest). Current month ends
  // today; a past month ends on that month's last day.
  const today = getETDateString();
  const windowEnd = isCurrent ? today : lastDayOfMonth(monthStr);
  const dayCols = [];
  const _endD = new Date(windowEnd + "T12:00:00Z");
  for (let i = 4; i >= 0; i--) { const d = new Date(_endD); d.setUTCDate(_endD.getUTCDate() - i); dayCols.push(d.toISOString().slice(0,10)); }
  // Columns before this index fall in the PREVIOUS month — dimmed, with a divider
  // marking where the scored month begins (stats only count this-month days).
  const firstInMonthIdx = dayCols.findIndex(function(ds){ return ds.slice(0,7) === monthStr; });
  const hasPrevMonth = firstInMonthIdx > 0;
  // Today's crest IS the live puzzle — keep it locked until the viewer has played.
  const meKey = profile ? normalizeUsername(profile.username) : null;

            <div className="gi-serif gi-gold" style={{fontSize:22,fontWeight:700}}>Monthly Leaderboard</div>
            <div style={{fontSize:11,color:"rgba(200,168,75,.4)",letterSpacing:".1em"}}>STREAK CHAMPIONS</div>
          </div>
        </div>

        {/* Month navigation */}

          <button className="gi-btn gi-btn-outline" style={{padding:"8px 16px",fontSize:18,lineHeight:1}}
            onClick={()=>setOffset(offset-1)} aria-label="Previous month">←</button>
          <div style={{textAlign:"center",minWidth:140}}>
            <div className="gi-serif gi-gold" style={{fontSize:16,fontWeight:700,lineHeight:1.1}}>
              {new Date(monthStr + "-15").toLocaleString("en-US",{month:"long"})}
              {" "}{monthStr.slice(0,4)}
            </div>
            <div style={{fontSize:10,color:"rgba(200,168,75,.5)",letterSpacing:".12em",marginTop:2}}>
              {isCurrent ? "THIS MONTH" : "FINAL STANDINGS"}

          <button className="gi-btn gi-btn-outline" style={{padding:"8px 16px",fontSize:18,lineHeight:1,

                        const base = {textAlign:"center",borderLeft:divider?"1px solid rgba(240,208,96,.4)":"none"};
                        const p = byDate[ds];
                        if (!p) return <div key={ds} style={Object.assign({fontSize:13,color:"rgba(200,168,75,.18)"},base)}>·</div>;
                        const t = (p.time_ms/1000).toFixed(1) + "s";
                        return p.correct
                          ? <div key={ds} style={Object.assign({fontSize:13,fontWeight:600,color:out?"rgba(232,213,160,.45)":"#e8d5a0"},base)}>{t}</div>
                          : <div key={ds} style={Object.assign({fontSize:11,color:out?"rgba(217,138,106,.5)":"#d98a6a"},base)}>💨{t}</div>;
                      })}
                    </div>
                  </div>
                );
              })}
            </div>

            {myRank && myRank > 10 && (
              <div className="gi-card" style={{padding:"12px 16px",textAlign:"center"}}>
                <div style={{fontSize:11,color:"rgba(200,168,75,.5)",letterSpacing:".1em",marginBottom:4}}>YOUR RANK</div>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:28,color:"#f0dfa0",fontWeight:700}}>
                  #{myRank}
                </div>
                <div style={{fontSize:12,color:"rgba(200,180,140,.5)",marginTop:4}}>
                  {isCurrent ? "Reach the top 10 to earn a trophy." : monthName + " final standing."}
                </div>
              </div>
            )}
          </>
        )}

        <div style={{textAlign:"center",fontSize:11,color:"rgba(200,168,75,.35)",letterSpacing:".06em",marginTop:6}}>
          {isCurrent ? "Resets the 1st of every month at 12:01am ET. 🥇 #1 · 🥈 top 3 · 🥉 top 10."
                     : "Final standings for " + monthName + "."}
        </div>
      </div>
    </div>
  );
}

function GolfIQ() {
  const [screen, setScreen]       = useState("loading");
  const [profile, setProfile]     = useState(null);
  const [history, setHistory]     = useState([]);
  const [trophies, setTrophies]   = useState(new Set());
  const [currentGame, setGame]    = useState(null);
  const [gameResult, setResult]   = useState(null);
  const [newTrophies, setNewTr]   = useState([]);
  const [logos, setLogos]         = useState({});
  const lastGameTs                = useRef(null);
  const [dailyHistory, setDailyHistory] = useState([]);
  const [incomingChallenge, setIncomingChallenge] = useState(null);  

  // Load persisted data
  useEffect(() => {
    (async () => {
      // ── Challenge link: check for ?c= parameter ──
      const challengeSeed = new URLSearchParams(window.location.search).get("c");
      if (challengeSeed) {
        await Promise.all([S.get("gp-profile"), S.get("gp-history"), S.get("gp-trophies"), S.get("gp-daily-history")]).then(async ([p,h,tr,dh]) => {
          if (p) setProfile(p);
          if (h) setHistory(h);
          if (tr) setTrophies(new Set(tr));
          if (dh) setDailyHistory(dh);
          const logoData = await db.loadAll();
          if (Object.keys(logoData).length > 0) setLogos(logoData);
        });
        setIncomingChallenge(challengeSeed);
        window.history.replaceState({}, document.title, window.location.pathname);
        setScreen("challenge");
        return;
      }

      // ── Magic link callback: check URL for token before anything else ──
      const urlParams = new URLSearchParams(window.location.hash.substring(1) || window.location.search.substring(1));
      const hasMagicToken = urlParams.get("access_token") || urlParams.get("token_hash");
      if (hasMagicToken) {
        setScreen("magiclink-recovering");
        const recovered = await authDb.handleMagicLinkCallback();
        // Clean the token from the URL so refresh doesn't re-trigger
        window.history.replaceState({}, document.title, window.location.pathname);
        if (recovered) {
          // Build a profile from the recovered identity
          const recoveredProfile = { username: recovered.username, email: recovered.email };
          // Hydrate all history from cloud
          const cloud = await dailyDb.getAllPlays(recovered.username);
          const merged = mergeDailyHistory([], cloud);
          setProfile(recoveredProfile);
          setDailyHistory(merged);
          await S.set("gp-profile", recoveredProfile);
          await S.set("gp-daily-history", merged);
          setScreen("home");
          return;
        } else {
          // Token invalid or no linked account — fall through to normal load
          setScreen("loading");
        }
      }

      const [p, h, tr, dh] = await Promise.all([S.get("gp-profile"), S.get("gp-history"), S.get("gp-trophies"), S.get("gp-daily-history")]);
      if (p) setProfile(p);
      if (h) setHistory(h);
      if (tr) setTrophies(new Set(tr));
      if (dh) setDailyHistory(dh);
      // Load logos from Supabase
      const logoData = await db.loadAll();
      if (Object.keys(logoData).length > 0) setLogos(logoData);
      setScreen(p ? "home" : "setup");
      // Hydrate daily history from the cloud (cross-device truth), merge with
      // local, and SELF-HEAL: if a play was recorded on a device but never
      // reached the cloud (dropped network, closed tab), push it up now and
      // refresh this month's leaderboard row from the true record.
      if (p && p.username) {
        const cloud = await dailyDb.getAllPlays(p.username);
        const merged = mergeDailyHistory(dh || [], cloud);
        setDailyHistory(merged);
        await S.set("gp-daily-history", merged);

        // Re-log any local plays the cloud is missing
        const cloudDays = new Set((cloud || []).map(e => e.day));
        const missing = merged.filter(e => !cloudDays.has(e.day));
        for (const e of missing) {
          const upto = merged.filter(h => h.day <= e.day);
          const sa = computeStreak(upto, e.day).streak;
          await dailyDb.logPlay({
            username: p.username, dayNum: e.dayNum, dayStr: e.day,
            courseId: e.courseId, correct: e.correct, timeMs: e.timeMs, streakAfter: sa
          });
        }

        // Rewrite the current month's leaderboard row from the merged truth
        const monthStr = getETDateString().slice(0, 7);
        const monthHistory = merged.filter(h => h.day.startsWith(monthStr));
        if (monthHistory.length) {
          await dailyDb.upsertMonthlyStreak({
            username: p.username, monthStr,
            currentStreak: monthStreak(merged, monthStr),
            totalTimeMs: monthHistory.reduce((s, h) => s + h.timeMs, 0),
            playsThisMonth: monthHistory.length,
            allTimeStreak: computeStreak(merged, getETDateString()).streak
          });
        }
      }
    })();
  }, []);

  const saveLogo = function(id, dataUrl, silent) {
    var img = new Image();
    img.onload = function() {
      var MAX = 160;
      var scale = Math.min(MAX / img.width, MAX / img.height, 1);
      var canvas = document.createElement("canvas");
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      // Try progressively lower quality until small enough
      var small = canvas.toDataURL("image/jpeg", 0.7);
      if (small.length > 51200) small = canvas.toDataURL("image/jpeg", 0.5);
      if (small.length > 51200) small = canvas.toDataURL("image/jpeg", 0.3);
      if (small.length > 51200) {
        alert("Image too large even after compression (" + Math.round(small.length/1024) + "KB). Try a simpler/smaller image.");
        return;
      }
      setLogos(function(prev){ return Object.assign({}, prev, {[id]: small}); });
      if (!silent) db.save(id, small);
    };
    img.onerror = function() { alert("Could not read image."); };
    img.src = dataUrl;
  };

  const removeLogo = (id) => {
    db.remove(id);
    setLogos(prev => {
      const n = Object.assign({}, prev);
      delete n[id];
      return n;
    });
  };

  const stats = calcStats(history);

  const saveProfile = async (p) => { setProfile(p); await S.set("gp-profile", p); setScreen("home"); };

  const saveEmail = async (email) => {
    if (!profile) return { ok: false, message: "No profile." };
    const res = await dailyDb.saveEmail({ username: profile.username, email });
    if (res && res.ok) {
      const updated = Object.assign({}, profile, { email: email.trim().toLowerCase() });
      setProfile(updated);
      await S.set("gp-profile", updated);
    }
    return res;
  };

  const dismissEmailPrompt = async () => {
    if (!profile) return;
    const updated = Object.assign({}, profile, { emailPromptDismissed: true });
    setProfile(updated);
    await S.set("gp-profile", updated);
  };

  const startGame = () => {
    const quick = lastGameTs.current && Date.now() - lastGameTs.current < 30*60*1000;
    setGame(makeGame()); setScreen("playing");
  };

  const onDailyComplete = async (entry, streakInfo) => {
  const newDaily = [...dailyHistory, entry];
  setDailyHistory(newDaily);
  await S.set("gp-daily-history", newDaily);
};
  const onGameComplete = async ({ results, times, picked }) => {
    lastGameTs.current = Date.now();
    const gameRecord = { results, times, picked, totalMs: times.reduce((a,b)=>a+b,0), ts: Date.now() };
    const newHistory = [...history, gameRecord];

    // Quick return check
    const hadQuick = history.length > 0 && (Date.now() - history[history.length-1].ts < 30*60*1000);
    const augmentedStats = calcStats(newHistory);
    if (hadQuick) augmentedStats.quickReturn = true;

    const { earned, newOnes } = checkTrophies(augmentedStats, trophies);

    setHistory(newHistory);
    setTrophies(earned);
    setResult({ results, times, picked });
    setNewTr(newOnes);
    setScreen("results");

    await Promise.all([S.set("gp-history", newHistory), S.set("gp-trophies", [...earned])]);
  };

  if (screen === "magiclink-recovering") return (
    <div className="gi-app" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <style>{css}</style>
      <div className="gi-stars"/>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:36,marginBottom:12}}>🔗</div>
        <div style={{fontSize:14,color:"rgba(200,168,75,.5)",letterSpacing:".2em"}}>RESTORING YOUR ACCOUNT…</div>
      </div>
    </div>
  );

  if (screen === "loading") return (
    <div className="gi-app" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <style>{css}</style>
      <div className="gi-stars"/>
      <div style={{fontSize:14,color:"rgba(200,168,75,.4)",letterSpacing:".2em"}}>LOADING…</div>
    </div>
  );

  return (
    <>
      <style>{css}</style>
      {screen === "setup"    && <SetupScreen onSave={saveProfile} onRecoverAccount={()=>setScreen("magiclink")}/>}
      {screen === "magiclink" && <MagicLinkScreen onBack={()=>setScreen("setup")} onRecovered={()=>setScreen("home")}/>}
      {screen === "home"     && <HomeScreen profile={profile} stats={stats} trophyCount={trophies.size} dailyStreak={computeStreak(dailyHistory)} dailyPlayedToday={dailyHistory.some(h => h.day === getETDateString())} onPlay={startGame} onBattle={()=>setScreen("battle")} onDaily={()=>setScreen("daily")} onStats={()=>setScreen("stats")} onTrophies={()=>setScreen("trophies")} onEditProfile={()=>setScreen("setup")} onAdmin={()=>setScreen("admin")}/>}
      {screen === "battle"    && <FriendBattleHub profile={profile} logos={logos} onBack={()=>setScreen("home")}/>}
      {screen === "challenge"  && <HeadToHeadHub profile={profile} logos={logos} incomingSeed={incomingChallenge} onBack={()=>setScreen("home")}/>}      {screen === "playing"  && <GameScreen game={currentGame} profile={profile} logos={logos} onSaveLogo={saveLogo} onComplete={onGameComplete}/>}
      {screen === "results"  && <ResultsScreen game={currentGame} results={gameResult.results} times={gameResult.times} picked={gameResult.picked} profile={profile} stats={stats} newTrophies={newTrophies} onPlayAgain={startGame} onHome={()=>setScreen("home")}/>}
      {screen === "stats"    && <StatsScreen stats={stats} history={history} onBack={()=>setScreen("home")}/>}
      {screen === "trophies" && <TrophiesScreen earned={trophies} onBack={()=>setScreen("home")}/>}
      {screen === "daily"       && <DailyScreen profile={profile} logos={logos} dailyHistory={dailyHistory} onComplete={onDailyComplete} onBack={()=>setScreen("home")} onViewLeaderboard={()=>setScreen("leaderboard")} onSaveEmail={saveEmail} onDismissEmail={dismissEmailPrompt}/>}
      {screen === "leaderboard" && <LeaderboardScreen profile={profile} logos={logos} onBack={()=>setScreen("daily")}/>}
      {screen === "admin"    && <AdminScreen logos={logos} onSaveLogo={saveLogo} onRemoveLogo={removeLogo} onBack={()=>setScreen("home")}/>}
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GolfIQ />);
  </script>
</body>
</html>
